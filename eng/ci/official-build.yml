trigger:
  batch: true
  branches:
    include:
      - main
      - release/*

pr: none

schedules:
  - cron: '0 0 * * MON'
    displayName: At 12:00 AM, only on Monday
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

variables:
  - template: ci/variables/build.yml@eng
  - template: ci/variables/cfs.yml@eng

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    stages:
      - stage: Build
        jobs:
          - template: /eng/templates/official/jobs/build-artifacts.yml@self

      - stage: RunTests
        dependsOn: Build
        jobs:
          - template: /eng/templates/jobs/ci-tests.yml@self
            parameters:
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              poolName: 1es-pool-azfunc

      - stage: RunE2ETests
        dependsOn: Build
        jobs:
          - template: /eng/templates/official/jobs/e2e-tests.yml@self
            parameters:
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              PoolName: 1es-pool-azfunc
              acaServiceConnection: 'larohra-sandboxgroup-test'

      # ---------------------------------------------------------------------
      # Post-main ACA deployment and qualification (issue #166).
      #
      # These stages complement the current-checkout ACA smoke inside
      # RunE2ETests rather than replacing it: that smoke proves the current
      # checkout works, these prove a *deployed build* works.
      #
      # Two-phase by design -- both runtimes finish cold start before either
      # enters the expensive suite -- and every stage is continueOnError while
      # the pipeline stabilizes. Promotion to a blocking gate is a separate,
      # explicitly human-approved step.
      #
      # Targets come from non-secret pipeline variables, matching how the
      # existing ACA smoke sources ACA_SANDBOX_GROUP_RESOURCE_ID. None of these
      # are credentials -- they are configuration that simply must not be
      # committed to a public repository.
      #
      # Deliberately NOT a variable group: a `- group:` reference that does not
      # resolve fails pipeline *compilation*, which would take Build, RunTests,
      # and RunE2ETests down with it. Plain variables degrade to a failure
      # inside the ACA stages, which are continueOnError.
      # ---------------------------------------------------------------------
      - stage: AcaSweep
        displayName: 'ACA pre-run leak sweep'
        # No dependsOn: this starts alongside Build and costs no wall-clock. It
        # is a leak *detector*, not cleanup -- see the template for why it runs
        # before the qualification rather than after it.
        dependsOn: []
        jobs:
          - template: /eng/templates/official/jobs/aca-sweep.yml@self
            parameters:
              acaServiceConnection: 'larohra-sandboxgroup-test'
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              poolName: 1es-pool-azfunc

      - stage: AcaDeployColdPy313
        displayName: 'ACA deploy + cold start (3.13)'
        dependsOn:
          - Build
          - AcaSweep
        jobs:
          - template: /eng/templates/official/jobs/aca-deploy-cold.yml@self
            parameters:
              runtimeTarget: 'python313'
              pythonVersion: '3.13'
              constraintsFile: 'eng/constraints/aca-fixture-py313.txt'
              appSiteName: $(ACA_DEPLOYED_APP_SITE_NAME_PY313)
              baseUrl: $(ACA_DEPLOYED_FUNCTION_BASE_URL_PY313)
              acaServiceConnection: 'larohra-sandboxgroup-test'
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              poolName: 1es-pool-azfunc

      - stage: AcaDeployColdPy314
        displayName: 'ACA deploy + cold start (3.14)'
        dependsOn:
          - Build
          - AcaSweep
        jobs:
          - template: /eng/templates/official/jobs/aca-deploy-cold.yml@self
            parameters:
              runtimeTarget: 'python314'
              pythonVersion: '3.14'
              constraintsFile: 'eng/constraints/aca-fixture-py314.txt'
              appSiteName: $(ACA_DEPLOYED_APP_SITE_NAME_PY314)
              baseUrl: $(ACA_DEPLOYED_FUNCTION_BASE_URL_PY314)
              acaServiceConnection: 'larohra-sandboxgroup-test'
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              poolName: 1es-pool-azfunc

      - stage: AcaQualifyPy313
        displayName: 'ACA qualification suite (3.13)'
        # Depends on BOTH cold legs: the phase boundary is what makes a
        # cold-start regression fail fast for both runtimes before either
        # spends its load budget.
        dependsOn:
          - AcaDeployColdPy313
          - AcaDeployColdPy314
        jobs:
          - template: /eng/templates/official/jobs/aca-qualify.yml@self
            parameters:
              runtimeTarget: 'python313'
              pythonVersion: '3.13'
              appSiteName: $(ACA_DEPLOYED_APP_SITE_NAME_PY313)
              baseUrl: $(ACA_DEPLOYED_FUNCTION_BASE_URL_PY313)
              acaServiceConnection: 'larohra-sandboxgroup-test'
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              poolName: 1es-pool-azfunc

      - stage: AcaQualifyPy314
        displayName: 'ACA qualification suite (3.14)'
        dependsOn:
          - AcaDeployColdPy313
          - AcaDeployColdPy314
        jobs:
          - template: /eng/templates/official/jobs/aca-qualify.yml@self
            parameters:
              runtimeTarget: 'python314'
              pythonVersion: '3.14'
              appSiteName: $(ACA_DEPLOYED_APP_SITE_NAME_PY314)
              baseUrl: $(ACA_DEPLOYED_FUNCTION_BASE_URL_PY314)
              acaServiceConnection: 'larohra-sandboxgroup-test'
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              poolName: 1es-pool-azfunc
