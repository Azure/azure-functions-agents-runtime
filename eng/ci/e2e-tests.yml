trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
    - main
    - feature/*

schedules:
  - cron: '0 0 * * MON'
    displayName: At 12:00 AM, only on Monday
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

variables:
  - template: ci/variables/build.yml@eng
  - template: ci/variables/cfs.yml@eng

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    stages:
      - stage: Build
        jobs:
          - template: /eng/templates/official/jobs/build-artifacts.yml@self

      - stage: RunE2ETests
        dependsOn: Build
        jobs:
          - template: /eng/templates/official/jobs/e2e-tests.yml@self
            # Secret variables are unavailable to pull requests from forks.
            condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
            parameters:
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              PoolName: 1es-pool-azfunc
