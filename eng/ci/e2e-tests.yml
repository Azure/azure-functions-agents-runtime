parameters:
  - name: acaServiceConnection
    displayName: 'ACA smoke: Azure service connection'
    type: string
    default: 'larohra-sandboxgroup-test'
  - name: acaRuntimeTarget
    displayName: 'Deployed ACA runtime target'
    type: string
    default: both
    values:
      - both
      - python313
      - python314
  - name: acaLoadConcurrency
    displayName: 'Deployed ACA load concurrency'
    type: string
    default: '5'
    values:
      - '5'
      - '100'
  - name: acaProvisionConcurrency
    displayName: 'Deployed ACA provisioning concurrency'
    type: string
    default: '2'
    values:
      - '1'
      - '2'
      - '4'

trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
    - main
    - feature/*

schedules:
  - cron: '0 0 * * MON'
    displayName: At 12:00 AM, only on Monday
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

variables:
  - template: variables/aca-deployed-runtime-targets.yml
  - template: ci/variables/build.yml@eng
  - template: ci/variables/cfs.yml@eng

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    stages:
      - stage: Build
        jobs:
          - template: /eng/templates/official/jobs/build-artifacts.yml@self

      - stage: RunE2ETests
        dependsOn: Build
        jobs:
          - template: /eng/templates/official/jobs/e2e-tests.yml@self
            parameters:
              artifactFeed: 'internal/PythonSDK_Internal_PublicPackages'
              PoolName: 1es-pool-azfunc
              acaServiceConnection: ${{ parameters.acaServiceConnection }}
              acaRuntimeTarget: ${{ parameters.acaRuntimeTarget }}
              acaLoadConcurrency: ${{ parameters.acaLoadConcurrency }}
              acaProvisionConcurrency: ${{ parameters.acaProvisionConcurrency }}
