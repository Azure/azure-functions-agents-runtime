# Phase 1 of the post-main ACA qualification: deploy one runtime leg, prove the
# deployed app really is this build, then measure a genuinely cold start.
#
# Cold start lives here, immediately after deployment, for two reasons: the app
# is authentically cold at that moment, and cold start is the cheapest and most
# diagnostic leg. Both runtime legs must clear this phase before either enters
# the expensive phase 2, so a cold-start regression fails fast for both rather
# than being found after one leg has already spent its load budget.

parameters:
  - name: runtimeTarget
    type: string
  - name: pythonVersion
    type: string
  - name: constraintsFile
    type: string
  - name: appSiteName
    type: string
  - name: baseUrl
    type: string
  - name: acaServiceConnection
    type: string
  - name: artifactFeed
    type: string
  - name: poolName
    type: string

jobs:
  - job: AcaDeployCold_${{ parameters.runtimeTarget }}
    displayName: 'ACA deploy + cold start (${{ parameters.pythonVersion }})'
    # Nonblocking during stabilization. Promotion to a blocking gate is a
    # separate, explicitly human-approved step.
    continueOnError: true
    # Bounded so a hung ACA stage cannot stretch the release pipeline this now
    # shares. Sized against the runtime's own contract: a 90s setup budget and a
    # 180s synchronous cap, plus deployment and remote build.
    timeoutInMinutes: 45

    pool:
      name: ${{ parameters.poolName }}
      image: 1es-ubuntu-22.04
      os: linux

    steps:
      - checkout: self

      - download: current
        artifact: azurefunctions-agents-runtime
        displayName: 'Download the build artifact'

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.13'
        displayName: 'Use Python for pipeline tooling'

      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.artifactFeed }}

      - bash: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -U -e ".[dev,aca_sandbox]"
        displayName: 'Install pipeline tooling'

      - task: AzureCLI@2
        displayName: 'Preflight deployment rights'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            python eng/scripts/aca_qualification_pipeline.py preflight-deploy \
              --app-name "${{ parameters.appSiteName }}" \
              --resource-group "$(ACA_DEPLOYED_RESOURCE_GROUP)"
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'

      - bash: |
          set -euo pipefail
          # The version is read from the checkout that produced the wheel, so the
          # marker records the same version the artifact carries.
          RUNTIME_VERSION="$(python -c 'import azure_functions_agents as a; print(a.__version__)')"
          echo "Runtime version: ${RUNTIME_VERSION}"
          python eng/scripts/aca_qualification_pipeline.py assemble \
            --artifact-root "$(Pipeline.Workspace)/azurefunctions-agents-runtime" \
            --staging-root "$(Build.ArtifactStagingDirectory)/aca-fixture" \
            --constraints-file "${{ parameters.constraintsFile }}" \
            --commit-sha "$(Build.SourceVersion)" \
            --build-id "$(Build.BuildId)" \
            --branch "$(Build.SourceBranch)" \
            --runtime-version "${RUNTIME_VERSION}"
        displayName: 'Assemble the deployable fixture'

      - task: AzureCLI@2
        displayName: 'Deploy with remote build'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            cd "$(Build.ArtifactStagingDirectory)/aca-fixture"
            zip -qr "$(Build.ArtifactStagingDirectory)/aca-fixture.zip" .

            # Flex Consumption always performs a remote (Oryx) build when a zip
            # carrying requirements.txt is deployed, so there is no build toggle
            # to set. SCM_DO_BUILD_DURING_DEPLOYMENT in particular is rejected
            # outright -- "not supported with this SKU" -- and setting it fails
            # the deployment. Remote build is still what happens here, which is
            # the point: this is the same path a customer uses.
            az functionapp deployment source config-zip \
              --name "${{ parameters.appSiteName }}" \
              --resource-group "$(ACA_DEPLOYED_RESOURCE_GROUP)" \
              --src "$(Build.ArtifactStagingDirectory)/aca-fixture.zip" \
              --output none
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'

      - task: AzureCLI@2
        displayName: 'Tag the app with build metadata (best effort)'
        continueOnError: true
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            # Portal-readable metadata only, never the attestation gate: a tag is
            # a separate ARM call and so is not atomic with the deployment.
            az tag update --operation merge \
              --resource-group "$(ACA_DEPLOYED_RESOURCE_GROUP)" \
              --name "${{ parameters.appSiteName }}" \
              --resource-type Microsoft.Web/sites \
              --tags "build_id=$(Build.BuildId)" "commit_sha=$(Build.SourceVersion)" \
              --output none || true
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'

      - task: AzureCLI@2
        displayName: 'Verify the deployed build'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            python eng/scripts/aca_qualification_pipeline.py check-build \
              --base-url "${{ parameters.baseUrl }}" \
              --token-scope "$(ACA_DEPLOYED_EASY_AUTH_TOKEN_SCOPE)" \
              --build-id "$(Build.BuildId)" \
              --commit-sha "$(Build.SourceVersion)" \
              --python-version "${{ parameters.pythonVersion }}"
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'

      - task: AzureCLI@2
        displayName: 'Cold start qualification'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            python eng/scripts/aca_deployed_qualification.py cold-start \
              --runtime-target "${{ parameters.runtimeTarget }}"
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'
          AZURE_FUNCTIONS_AGENTS_RUN_DEPLOYED_ACA_SMOKE: '1'
          ACA_DEPLOYED_COLD_START_SAMPLES: '3'
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_FUNCTION_BASE_URL: ${{ parameters.baseUrl }}
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SITE_NAME: ${{ parameters.appSiteName }}
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_AGENT_SLUG: $(ACA_DEPLOYED_AGENT_SLUG)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_TOKEN_SCOPE: $(ACA_DEPLOYED_EASY_AUTH_TOKEN_SCOPE)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_AUDIENCE: $(ACA_DEPLOYED_EASY_AUTH_AUDIENCE)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TIMEOUT_SECONDS: '230'
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_SERVICE_URI: $(ACA_DEPLOYED_TABLE_SERVICE_URI)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_NAME: $(ACA_DEPLOYED_TABLE_NAME)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SUBSCRIPTION_ID: $(ACA_DEPLOYED_APP_SUBSCRIPTION_ID)
          AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_GROUP_RESOURCE_ID: $(ACA_SANDBOX_GROUP_RESOURCE_ID)
          AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_REGION: $(ACA_SANDBOX_REGION)
