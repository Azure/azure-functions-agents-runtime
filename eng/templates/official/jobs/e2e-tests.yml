parameters:
  - name: artifactFeed
    type: string
    default: 'public/PythonSDK_PublicPackages'
  - name: PoolName
    type: string
    default: '1es-pool-azfunc'
  - name: acaServiceConnection
    type: string
    default: 'larohra-sandboxgroup-test'
  - name: acaRuntimeTarget
    displayName: 'Deployed ACA runtime target'
    type: string
    default: both
    values:
      - both
      - python313
      - python314
  - name: acaLoadConcurrency
    displayName: 'Deployed ACA load concurrency'
    type: string
    default: '5'
    values:
      - '5'
      - '100'
  - name: acaProvisionConcurrency
    displayName: 'Deployed ACA provisioning concurrency'
    type: string
    default: '1'
    values:
      - '1'
      - '2'
      - '4'

jobs:
  - job: "E2ETests"
    displayName: 'Run Azure Functions Agent Runtime E2E Tests'

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-22.04
      os: linux

    strategy:
      matrix:
        Python313:
          PYTHON_VERSION: '3.13'
        Python314:
          PYTHON_VERSION: '3.14'

    steps:
      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.artifactFeed }}
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - bash: |
          python --version
        displayName: 'Check python version'
      - bash: |
          python -m pip install --upgrade pip
          python -m pip install -U -e .[dev]
        displayName: 'Install dependencies for $(PYTHON_VERSION)'

      - template: /eng/templates/install-core-tools.yml@self

      - bash: |
          docker run -d --name azurite \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --skipApiVersionCheck \
              --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
          echo "Waiting for Azurite to start..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:10000/ > /dev/null; then
              echo "Azurite is up."
              break
            fi
            sleep 1
          done
        displayName: 'Start Azurite'

      # Run under AzureCLI@2 so the task performs `az login` as the service
      # connection's identity. The `func` host and its Python worker are child
      # processes that inherit AZURE_CONFIG_DIR, so DefaultAzureCredential's
      # AzureCliCredential reuses that login when the agents call Foundry.
      # The connection's identity must hold "Cognitive Services User" (or
      # "Azure AI User" where available) on the target Foundry (AIServices)
      # account so it can create/run agents (agents/write). See the RBAC command
      # in the PR / repo notes.
      - task: AzureCLI@2
        displayName: 'Run E2E tests'
        inputs:
          azureSubscription: 'saf-foundry-connection'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            python -m pytest -m e2e tests/endtoend -v
        env:
          AzureWebJobsStorage: 'UseDevelopmentStorage=true'
          FUNCTIONS_WORKER_RUNTIME: 'python'
          AZURE_TOKEN_CREDENTIALS: 'dev'
          FOUNDRY_PROJECT_ENDPOINT: $(FOUNDRY_PROJECT_ENDPOINT)
          FOUNDRY_MODEL: $(FOUNDRY_MODEL)

  - job: "ACAHarnessEntrypointSmoke"
    displayName: 'Run ACA harness entrypoint smoke test'
    condition: in(variables['Build.Reason'], 'Schedule', 'Manual')
    continueOnError: true

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-22.04
      os: linux

    steps:
      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.artifactFeed }}
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.13'
      - bash: |
          python --version
        displayName: 'Check python version'
      - bash: |
          python -m pip install --upgrade pip
          python -m pip install -U -e ".[dev,aca_sandbox]"
        displayName: 'Install ACA smoke dependencies'

      - task: AzureCLI@2
        displayName: 'Verify ACA sandbox group is reachable'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            echo "Authenticated as:"
            az account show --query '{subscription:name, subscriptionId:id, user:user.name}' --output json

            # An undefined pipeline variable arrives as the literal "$(NAME)", which is
            # non-empty and would pass a plain empty check.
            for name in ACA_SANDBOX_GROUP_RESOURCE_ID ACA_SANDBOX_DISK; do
              eval "value=\${AZURE_SMOKE_${name}:-}"
              if [ -z "${value}" ] || case "${value}" in '$('*')') true;; *) false;; esac; then
                echo "Pipeline variable ${name} is not set. Define it on the pipeline before running this job." >&2
                exit 1
              fi
            done

            case "${AZURE_SMOKE_ACA_SANDBOX_GROUP_RESOURCE_ID}" in
              /subscriptions/*/resourceGroups/*/providers/Microsoft.App/sandboxGroups/*) ;;
              *)
                echo "ACA_SANDBOX_GROUP_RESOURCE_ID is not a Sandbox Group resource ID: ${AZURE_SMOKE_ACA_SANDBOX_GROUP_RESOURCE_ID}" >&2
                exit 1
                ;;
            esac

            az rest --method get \
              --url "https://management.azure.com${AZURE_SMOKE_ACA_SANDBOX_GROUP_RESOURCE_ID}?api-version=2026-02-01-preview" \
              --query '{id:id, location:location}' \
              --output json

            # ARM (above) is the control plane; the smoke path also needs the data-plane
            # role, so probe it here to fail in seconds rather than 30 min into pytest.
            SIGNED_IN_IDENTITY="$(az account show --query user.name --output tsv || true)"
            AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_GROUP_RESOURCE_ID="${AZURE_SMOKE_ACA_SANDBOX_GROUP_RESOURCE_ID}" \
            AZURE_FUNCTIONS_AGENTS_ACA_PROBE_IDENTITY="${SIGNED_IN_IDENTITY}" \
              python eng/scripts/probe_aca_data_plane.py
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'
          AZURE_SMOKE_ACA_SANDBOX_GROUP_RESOURCE_ID: $(ACA_SANDBOX_GROUP_RESOURCE_ID)
          AZURE_SMOKE_ACA_SANDBOX_DISK: $(ACA_SANDBOX_DISK)

      - task: AzureCLI@2
        displayName: 'Run ACA harness entrypoint smoke test'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            python -m pytest -m live_aca \
              tests/live/test_aca_harness_entrypoint_smoke.py \
              tests/live/test_aca_run_journal_acceptance.py -v \
              -o log_cli=true -o log_cli_level=INFO
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'
          AZURE_FUNCTIONS_AGENTS_RUN_ACA_SMOKE: '1'
          AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_GROUP_RESOURCE_ID: $(ACA_SANDBOX_GROUP_RESOURCE_ID)
          AZURE_FUNCTIONS_AGENTS_ACA_SMOKE_DISK: $(ACA_SANDBOX_DISK)
          AZURE_FUNCTIONS_AGENTS_ACA_SMOKE_RUN_ID: $(Build.BuildId)

      - task: AzureCLI@2
        displayName: 'Reap ACA smoke sandboxes'
        condition: always()
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            python eng/scripts/reap_aca_smoke_sandboxes.py
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'
          AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_GROUP_RESOURCE_ID: $(ACA_SANDBOX_GROUP_RESOURCE_ID)
          AZURE_FUNCTIONS_AGENTS_ACA_SMOKE_RUN_ID: $(Build.BuildId)

  - job: "ACADeployedAgentTurn"
    displayName: 'Run deployed ACA agent-turn, lifecycle, and backing-loss qualification'
    dependsOn: ACADeployedColdStart
    condition: >-
      in(variables['Build.Reason'], 'Manual', 'Schedule')
    continueOnError: true
    timeoutInMinutes: 360

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-22.04
      os: linux

    strategy:
      maxParallel: 2
      matrix:
        ${{ if or(eq(parameters.acaRuntimeTarget, 'both'), eq(parameters.acaRuntimeTarget, 'python313')) }}:
          Python313:
            PYTHON_VERSION: '3.13'
            ACA_DEPLOYED_FUNCTION_BASE_URL: $(ACA_DEPLOYED_PY313_FUNCTION_BASE_URL)
            ACA_DEPLOYED_APP_SITE_NAME: $(ACA_DEPLOYED_PY313_APP_SITE_NAME)
        ${{ if or(eq(parameters.acaRuntimeTarget, 'both'), eq(parameters.acaRuntimeTarget, 'python314')) }}:
          Python314:
            PYTHON_VERSION: '3.14'
            ACA_DEPLOYED_FUNCTION_BASE_URL: $(ACA_DEPLOYED_PY314_FUNCTION_BASE_URL)
            ACA_DEPLOYED_APP_SITE_NAME: $(ACA_DEPLOYED_PY314_APP_SITE_NAME)

    variables:
      ACA_DEPLOYED_CONFIGURED_LOAD_CONCURRENCY: ${{ parameters.acaLoadConcurrency }}
      ACA_DEPLOYED_CONFIGURED_PROVISION_CONCURRENCY: ${{ parameters.acaProvisionConcurrency }}

    steps:
      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.artifactFeed }}
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - bash: |
          python -m pip install --upgrade pip
          python -m pip install -U -e ".[dev,aca_sandbox]"
        displayName: 'Install deployed ACA test dependencies'

      - task: AzureCLI@2
        displayName: 'Run deployed ACA agent-turn, lifecycle, and backing-loss qualification'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            for name in AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_FUNCTION_BASE_URL \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_AGENT_SLUG \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_TOKEN_SCOPE \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_AUDIENCE \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TIMEOUT_SECONDS \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_SERVICE_URI \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_NAME \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SUBSCRIPTION_ID \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SITE_NAME; do
              eval "value=\${${name}:-}"
              if [ -z "${value}" ] || case "${value}" in '$('*')') true;; *) false;; esac; then
                echo "Required deployed ACA environment ${name} is not set." >&2
                exit 1
              fi
            done
            az account show --query '{subscription:name, subscriptionId:id, user:user.name}' --output json
            # The job default is the sole automated N=5 diagnostic. Both runtime
            # legs share one Sandbox Group, so each may provision only one session.
            # A human single-runtime N=100 request may use all four known safe slots.
            case "${ACA_DEPLOYED_CONFIGURED_LOAD_CONCURRENCY:-}" in
              5|100) ;;
              *)
                echo "acaLoadConcurrency must be 5 or 100." >&2
                exit 1
                ;;
            esac
            case "${ACA_DEPLOYED_CONFIGURED_PROVISION_CONCURRENCY:-}" in
              1|2|4) ;;
              *)
                echo "acaProvisionConcurrency must be 1, 2, or 4." >&2
                exit 1
                ;;
            esac
            if [ "${ACA_DEPLOYED_CONFIGURED_LOAD_CONCURRENCY}" = "100" ] \
              && [ "${{ parameters.acaRuntimeTarget }}" = "both" ]; then
              echo "acaLoadConcurrency=100 requires acaRuntimeTarget=python313 or python314." >&2
              exit 1
            fi
            if [ "${ACA_DEPLOYED_CONFIGURED_PROVISION_CONCURRENCY}" -gt 1 ] \
              && [ "${{ parameters.acaRuntimeTarget }}" = "both" ]; then
              echo "acaProvisionConcurrency above 1 requires acaRuntimeTarget=python313 or python314." >&2
              exit 1
            fi
            export AZURE_FUNCTIONS_AGENTS_ACA_LOAD_CONCURRENCY="${ACA_DEPLOYED_CONFIGURED_LOAD_CONCURRENCY}"
            export AZURE_FUNCTIONS_AGENTS_ACA_PROVISION_CONCURRENCY="${ACA_DEPLOYED_CONFIGURED_PROVISION_CONCURRENCY}"
            python - <<'PY'
            import asyncio
            import base64
            import json
            import os

            from azure.identity.aio import DefaultAzureCredential


            async def main() -> None:
                credential = DefaultAzureCredential()
                try:
                    token = await credential.get_token(
                        os.environ[
                            "AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_TOKEN_SCOPE"
                        ]
                    )
                finally:
                    await credential.close()
                payload_segment = token.token.split(".")[1]
                payload_segment += "=" * (-len(payload_segment) % 4)
                claims = json.loads(base64.urlsafe_b64decode(payload_segment))
                safe_names = ("aud", "appid", "azp", "oid", "roles", "tid")
                print(
                    "Easy Auth token claim summary: "
                    + json.dumps({name: claims.get(name) for name in safe_names}, sort_keys=True)
                )


            asyncio.run(main())
            PY
            python -m pytest -m live_aca \
              tests/live/test_aca_deployed_agent_turn.py \
              tests/live/test_aca_deployed_lifecycle.py \
              tests/live/test_aca_deployed_loss.py \
              tests/live/test_aca_deployed_load.py -v \
              -o log_cli=true -o log_cli_level=INFO
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'
          AZURE_FUNCTIONS_AGENTS_RUN_DEPLOYED_ACA_SMOKE: '1'
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_FUNCTION_BASE_URL: $(ACA_DEPLOYED_FUNCTION_BASE_URL)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_AGENT_SLUG: $(ACA_DEPLOYED_AGENT_SLUG)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_TOKEN_SCOPE: $(ACA_DEPLOYED_EASY_AUTH_TOKEN_SCOPE)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_AUDIENCE: $(ACA_DEPLOYED_EASY_AUTH_AUDIENCE)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TIMEOUT_SECONDS: $(ACA_DEPLOYED_TIMEOUT_SECONDS)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_SERVICE_URI: $(ACA_DEPLOYED_TABLE_SERVICE_URI)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_NAME: $(ACA_DEPLOYED_TABLE_NAME)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SUBSCRIPTION_ID: $(ACA_DEPLOYED_APP_SUBSCRIPTION_ID)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SITE_NAME: $(ACA_DEPLOYED_APP_SITE_NAME)
          AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_GROUP_RESOURCE_ID: $(ACA_SANDBOX_GROUP_RESOURCE_ID)

  - job: "ACADeployedColdStart"
    displayName: 'Run deployed ACA cold-start qualification'
    condition: >-
      in(variables['Build.Reason'], 'Manual', 'Schedule')
    continueOnError: true
    timeoutInMinutes: 60

    pool:
      name: ${{ parameters.PoolName }}
      image: 1es-ubuntu-22.04
      os: linux

    strategy:
      maxParallel: 2
      matrix:
        ${{ if or(eq(parameters.acaRuntimeTarget, 'both'), eq(parameters.acaRuntimeTarget, 'python313')) }}:
          Python313:
            PYTHON_VERSION: '3.13'
            ACA_DEPLOYED_FUNCTION_BASE_URL: $(ACA_DEPLOYED_PY313_FUNCTION_BASE_URL)
            ACA_DEPLOYED_APP_SITE_NAME: $(ACA_DEPLOYED_PY313_APP_SITE_NAME)
        ${{ if or(eq(parameters.acaRuntimeTarget, 'both'), eq(parameters.acaRuntimeTarget, 'python314')) }}:
          Python314:
            PYTHON_VERSION: '3.14'
            ACA_DEPLOYED_FUNCTION_BASE_URL: $(ACA_DEPLOYED_PY314_FUNCTION_BASE_URL)
            ACA_DEPLOYED_APP_SITE_NAME: $(ACA_DEPLOYED_PY314_APP_SITE_NAME)

    steps:
      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.artifactFeed }}
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - bash: |
          python -m pip install --upgrade pip
          python -m pip install -U -e ".[dev,aca_sandbox]"
        displayName: 'Install deployed ACA cold-start dependencies'

      - task: AzureCLI@2
        displayName: 'Run deployed ACA cold-start qualification'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            for name in AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_FUNCTION_BASE_URL \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_AGENT_SLUG \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_TOKEN_SCOPE \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_AUDIENCE \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TIMEOUT_SECONDS \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_SERVICE_URI \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_NAME \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SUBSCRIPTION_ID \
              AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SITE_NAME; do
              eval "value=\${${name}:-}"
              if [ -z "${value}" ] || case "${value}" in '$('*')') true;; *) false;; esac; then
                echo "Required deployed ACA environment ${name} is not set." >&2
                exit 1
              fi
            done
            echo "Azure service connection authenticated"
            if [ -n "${ACA_DEPLOYED_COLD_START_SAMPLES:-}" ]; then
              case "${ACA_DEPLOYED_COLD_START_SAMPLES}" in
                [1-4]) ;;
                *)
                  echo "ACA_DEPLOYED_COLD_START_SAMPLES must be an integer from 1 through 4 in ACADeployedColdStart. For 5 samples, run direct pytest with a caller-provided watchdog longer than 65 minutes." >&2
                  exit 1
                  ;;
              esac
              export AZURE_FUNCTIONS_AGENTS_ACA_COLD_START_SAMPLES="${ACA_DEPLOYED_COLD_START_SAMPLES}"
            fi
            python - <<'PY'
            import asyncio
            import os

            from azure.identity.aio import DefaultAzureCredential


            async def main() -> None:
                credential = DefaultAzureCredential()
                try:
                    token = await credential.get_token(
                        os.environ[
                            "AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_TOKEN_SCOPE"
                        ]
                    )
                finally:
                    await credential.close()
                if not token.token:
                    raise RuntimeError("Easy Auth token acquisition returned an empty token")
                print("Easy Auth token acquired")


            asyncio.run(main())
            PY
            python -m pytest -m live_aca \
              tests/live/test_aca_deployed_cold_start.py -v \
              -o log_cli=true -o log_cli_level=INFO
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'
          AZURE_FUNCTIONS_AGENTS_RUN_DEPLOYED_ACA_SMOKE: '1'
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_FUNCTION_BASE_URL: $(ACA_DEPLOYED_FUNCTION_BASE_URL)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_AGENT_SLUG: $(ACA_DEPLOYED_AGENT_SLUG)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_TOKEN_SCOPE: $(ACA_DEPLOYED_EASY_AUTH_TOKEN_SCOPE)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_EASY_AUTH_AUDIENCE: $(ACA_DEPLOYED_EASY_AUTH_AUDIENCE)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TIMEOUT_SECONDS: $(ACA_DEPLOYED_TIMEOUT_SECONDS)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_SERVICE_URI: $(ACA_DEPLOYED_TABLE_SERVICE_URI)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_TABLE_NAME: $(ACA_DEPLOYED_TABLE_NAME)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SUBSCRIPTION_ID: $(ACA_DEPLOYED_APP_SUBSCRIPTION_ID)
          AZURE_FUNCTIONS_AGENTS_DEPLOYED_ACA_APP_SITE_NAME: $(ACA_DEPLOYED_APP_SITE_NAME)
          AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_GROUP_RESOURCE_ID: $(ACA_SANDBOX_GROUP_RESOURCE_ID)
