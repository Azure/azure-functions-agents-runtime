# Pre-run leak sweep.
#
# Deliberately runs BEFORE the qualification rather than cleaning up after it.
# ACA idle-delete and the controller's hourly reconciliation already reclaim
# sandboxes, so an end-of-run reaper would mostly be redundant -- and worse, by
# tidying up after every run it would mask the failure of both mechanisms. We
# would keep paying for leaks and never see them.
#
# Running first turns a leftover into a signal: nothing found means automatic
# cleanup is working; anything found means it is not, and says so loudly.
#
# Never fatal. A leak is worth shouting about, but not worth blocking a
# qualification that has not started yet.

parameters:
  - name: acaServiceConnection
    type: string
  - name: artifactFeed
    type: string
  - name: poolName
    type: string

jobs:
  - job: AcaSweep
    displayName: 'ACA pre-run leak sweep'
    continueOnError: true
    timeoutInMinutes: 15

    pool:
      name: ${{ parameters.poolName }}
      image: 1es-ubuntu-22.04
      os: linux

    steps:
      - checkout: self

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.13'
        displayName: 'Use Python for pipeline tooling'

      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.artifactFeed }}

      - bash: |
          set -euo pipefail
          python eng/scripts/aca_qualification_pipeline.py install-tooling
        displayName: 'Install pipeline tooling'

      - task: AzureCLI@2
        displayName: 'Report and clear stale sandboxes'
        inputs:
          azureSubscription: ${{ parameters.acaServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            # The sweep hunts other runs' leftovers, so it cannot narrow by this
            # run's BuildId the way the reaper does. Age is the substitute safety
            # property: six hours is far longer than any qualification run and
            # than the controller's ~1h reconciliation cadence, so a live
            # sandbox can never fall in scope.
            python eng/scripts/aca_qualification_pipeline.py sweep \
              --region "$(ACA_SANDBOX_REGION)" \
              --max-age-hours 6
        env:
          AZURE_TOKEN_CREDENTIALS: 'dev'
          AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_GROUP_RESOURCE_ID: $(ACA_SANDBOX_GROUP_RESOURCE_ID)
          AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_REGION: $(ACA_SANDBOX_REGION)
