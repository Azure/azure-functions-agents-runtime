parameters:
  - name: poolName
    type: string
    default: '1es-pool-azfunc-public'
  - name: artifactName
    type: string
    default: ''

jobs:
  - job: BuildVallyExecutor
    displayName: 'Build Vally executor npm package'

    pool:
      name: ${{ parameters.poolName }}
      image: 1es-ubuntu-22.04
      os: linux

    ${{ if ne(parameters.artifactName, '') }}:
      templateContext:
        outputParentDirectory: $(Build.ArtifactStagingDirectory)
        outputs:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/vally-executor
            artifactName: ${{ parameters.artifactName }}

    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
        displayName: 'Use Node.js 22'
      - task: npmAuthenticate@0
        inputs:
          workingFile: integrations/vally-executor-azure-functions/.npmrc
        displayName: 'Authenticate executor npm feed'
      - bash: npm ci --ignore-scripts --no-audit
        workingDirectory: integrations/vally-executor-azure-functions
        displayName: 'Install locked dependencies'
      - bash: npm run build
        workingDirectory: integrations/vally-executor-azure-functions
        displayName: 'Build executor'
      - ${{ if ne(parameters.artifactName, '') }}:
        - bash: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/vally-executor"
            npm pack --ignore-scripts --pack-destination "$(Build.ArtifactStagingDirectory)/vally-executor"
          workingDirectory: integrations/vally-executor-azure-functions
          displayName: 'Pack executor'