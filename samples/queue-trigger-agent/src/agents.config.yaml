# Global configuration for all agents in this function app

# Shared infrastructure
system_tools:
  dynamic_sessions_code_interpreter:
    endpoint: $ACA_SESSION_POOL_ENDPOINT

# Bound model-facing conversation history while retaining complete runtime history.
compaction:
  max_context_window_tokens: 8192
  max_output_tokens: 4096

# Default runtime configuration
model: $FOUNDRY_MODEL
timeout: 900
