# ACA qualification fixture — deployed by the post-main pipeline (FRD 0008 §14).
#
# Configuring `session_runtime.aca_sandbox` is itself what selects the ACA
# Sandbox execution backend; its absence would select the in-process default.
#
# The resource ID is substituted from the app setting of the same name at load
# time, so no subscription, resource group, or group name is committed here.
session_runtime:
  aca_sandbox:
    sandbox_group_resource_id: $AZURE_FUNCTIONS_AGENTS_ACA_SANDBOX_GROUP_RESOURCE_ID

timeout: 300
