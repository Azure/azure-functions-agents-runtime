<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Agent Chat</title>
	<style>
		:root {
			--bg: #f5f7fb;
			--panel: #ffffff;
			--border: #d8dce8;
			--text: #111827;
			--muted: #6b7280;
			--you: #2563eb;
			--assistant: #e8eefc;
			--danger: #b91c1c;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			color: var(--text);
			background: var(--bg);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			padding: 16px;
		}

		.app {
			width: min(900px, 100%);
			height: calc(100vh - 32px);
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 14px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px 14px;
			border-bottom: 1px solid var(--border);
			background: #fff;
		}

		.topbar-title {
			font-size: 14px;
			font-weight: 600;
		}

		.topbar-actions {
			display: flex;
			gap: 8px;
		}

		button {
			border: 1px solid var(--border);
			background: white;
			color: var(--text);
			border-radius: 8px;
			padding: 8px 10px;
			cursor: pointer;
			font-size: 13px;
		}

		button:hover { background: #f9fafb; }
		button:disabled { opacity: 0.6; cursor: not-allowed; }

		.gear-btn {
			width: 36px;
			height: 36px;
			display: grid;
			place-items: center;
			padding: 0;
			font-size: 16px;
		}

		.chat {
			flex: 1;
			overflow: auto;
			padding: 14px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			background: linear-gradient(180deg, #ffffff, #f8faff 70%);
		}

		.bubble-wrap {
			display: flex;
			width: 100%;
		}

		.bubble-wrap.you { justify-content: flex-end; }
		.bubble-wrap.assistant { justify-content: flex-start; }

		.bubble {
			max-width: min(75ch, 85%);
			padding: 10px 12px;
			border-radius: 12px;
			line-height: 1.4;
			font-size: 14px;
			white-space: pre-wrap;
			word-break: break-word;
			border: 1px solid var(--border);
			box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
		}

		.bubble p {
			margin: 0;
		}

		.bubble p + p,
		.bubble p + ul,
		.bubble p + ol,
		.bubble ul + p,
		.bubble ol + p,
		.bubble ul + ul,
		.bubble ol + ol,
		.bubble pre + p,
		.bubble p + pre,
		.bubble pre + ul,
		.bubble pre + ol {
			margin-top: 8px;
		}

		.bubble ul,
		.bubble ol {
			margin: 0;
			padding-left: 22px;
		}

		.bubble li + li {
			margin-top: 4px;
		}

		.bubble-intermediates {
			display: none;
			margin-top: 8px;
			padding-top: 8px;
			border-top: 1px dashed var(--border);
			font-size: 12px;
			color: var(--muted);
		}

		.bubble-intermediates.open {
			display: block;
		}

		.bubble-intermediates-title {
			font-weight: 600;
			margin-bottom: 4px;
		}

		.bubble-intermediates-text {
			white-space: pre-wrap;
			word-break: break-word;
		}

		.bubble a {
			color: inherit;
			text-decoration: underline;
		}

		.bubble .md-inline-code {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
			font-size: 0.92em;
			padding: 1px 5px;
			border-radius: 6px;
			background: rgba(15, 23, 42, 0.1);
		}

		.bubble .md-pre {
			margin: 0;
			padding: 9px 10px;
			border-radius: 10px;
			border: 1px solid var(--border);
			background: #f8fafc;
			overflow-x: auto;
		}

		.bubble .md-pre code {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
			font-size: 12px;
			line-height: 1.45;
		}

		.bubble .md-table-wrap {
			overflow-x: auto;
		}

		.bubble .md-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 13px;
		}

		.bubble .md-table th,
		.bubble .md-table td {
			border: 1px solid var(--border);
			padding: 6px 8px;
			text-align: left;
			vertical-align: top;
		}

		.bubble .md-table thead th {
			background: #f8fafc;
			font-weight: 600;
		}

		.bubble.you {
			background: var(--you);
			color: #fff;
			border-color: #1d4ed8;
			border-bottom-right-radius: 4px;
		}

		.bubble.assistant {
			background: var(--assistant);
			border-bottom-left-radius: 4px;
		}

		.bubble.assistant.has-details {
			cursor: pointer;
		}

		.bubble.assistant.has-details:hover {
			background: #dce7ff;
		}

		/* Auto-notification bubble (chat-client-injected workflow completion).
		 * Deliberately subtler than the user/copilot bubbles: this is an
		 * out-of-band, system-injected turn, not part of the user's typed
		 * conversation, so it should fade into the page rather than compete
		 * with surrounding chat content. */
		.bubble-wrap.auto { justify-content: center; }
		.bubble.auto {
			max-width: 70%;
			padding: 4px 10px;
			border-radius: 8px;
			background: #faf8ff;
			border: 1px solid #ebe5f7;
			color: #6b5e8a;
			font-size: 12px;
			line-height: 1.35;
			box-shadow: none;
			/* Override base .bubble's `pre-wrap`: this bubble's children are
			 * structured (span + inline <details>), so we don't want the
			 * template literal's indentation rendering as visible whitespace. */
			white-space: normal;
		}
		.auto-notification-body {
			color: inherit;
		}
		.auto-notification-body code {
			font-size: 11px;
			padding: 1px 4px;
			background: #f1ecf9;
			border-radius: 3px;
			color: #5a4d80;
		}
		.auto-notification-raw {
			display: inline;
			font-size: 11px;
		}
		.auto-notification-raw summary {
			display: inline;
			cursor: pointer;
			color: #8674b0;
			user-select: none;
			margin-left: 6px;
		}
		.auto-notification-raw summary::-webkit-details-marker { display: none; }
		.auto-notification-raw summary::marker { content: ""; }
		.auto-notification-raw summary::before {
			content: "▸ ";
			font-size: 9px;
			vertical-align: 1px;
		}
		.auto-notification-raw[open] summary::before {
			content: "▾ ";
		}
		.auto-notification-raw pre {
			display: block;
			margin: 4px 0 0;
			padding: 6px 8px;
			background: #f3eefa;
			border-radius: 4px;
			white-space: pre-wrap;
			word-break: break-word;
			color: #4c3d6e;
			font-size: 11px;
		}

		.workflow-card {
			max-width: 85%;
			padding: 10px 12px;
			border-radius: 12px;
			border-bottom-left-radius: 4px;
			background: #f3f5fb;
			border: 1px solid var(--border);
			font-size: 13px;
			line-height: 1.45;
			color: var(--text);
		}

		.workflow-card.terminal-Completed { background: #e8f5ec; border-color: #b7dcc2; }
		.workflow-card.terminal-Failed { background: #fbe9e9; border-color: #e7b2b2; }
		.workflow-card.terminal-Terminated,
		.workflow-card.terminal-Canceled { background: #f1eee4; border-color: #ddd4b6; }

		.workflow-card-header {
			display: flex;
			align-items: center;
			gap: 8px;
			font-weight: 600;
			margin-bottom: 4px;
		}

		.workflow-card-chip {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 2px 8px;
			border-radius: 999px;
			font-size: 11px;
			font-weight: 600;
			background: #dbe4f6;
			color: #1e3a8a;
		}

		.workflow-card.terminal-Completed .workflow-card-chip { background: #c6e7d1; color: #14532d; }
		.workflow-card.terminal-Failed .workflow-card-chip { background: #f3c6c6; color: #7f1d1d; }
		.workflow-card.terminal-Terminated .workflow-card-chip,
		.workflow-card.terminal-Canceled .workflow-card-chip { background: #e3dabb; color: #5b4a1a; }

		.workflow-card-spinner {
			width: 10px;
			height: 10px;
			border: 2px solid currentColor;
			border-right-color: transparent;
			border-radius: 50%;
			animation: wf-spin 0.9s linear infinite;
		}

		@keyframes wf-spin { to { transform: rotate(360deg); } }

		.workflow-card-id {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 11px;
			color: var(--muted);
			font-weight: 400;
		}

		.workflow-card-custom-status {
			color: var(--muted);
			margin-bottom: 4px;
		}

		.workflow-card-output {
			margin: 6px 0 0 0;
			padding: 8px;
			background: #fff;
			border: 1px solid var(--border);
			border-radius: 8px;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 11px;
			white-space: pre-wrap;
			overflow-x: auto;
			max-height: 240px;
		}

		.workflow-card-tasks {
			list-style: none;
			margin: 6px 0 0 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.workflow-card-tasks li {
			display: flex;
			align-items: baseline;
			gap: 8px;
			padding: 4px 8px;
			background: #fff;
			border: 1px solid var(--border);
			border-radius: 6px;
			font-size: 12px;
		}

		.workflow-task-id {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 11px;
			font-weight: 600;
			color: #1e3a8a;
			flex: 0 0 auto;
		}

		.workflow-task-result {
			color: var(--text);
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 11px;
			overflow-wrap: anywhere;
		}

		.meta {
			margin-top: 4px;
			font-size: 11px;
			color: var(--muted);
		}

		.bubble.you .meta {
			color: rgba(255, 255, 255, 0.92);
		}

		.composer {
			border-top: 1px solid var(--border);
			background: #fff;
			padding: 10px;
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 8px;
		}

		textarea {
			width: 100%;
			min-height: 42px;
			max-height: 160px;
			resize: vertical;
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 10px;
			font-size: 14px;
			font-family: inherit;
			outline: none;
		}

		textarea:focus { border-color: #93c5fd; }

		.send-btn {
			min-width: 88px;
			background: #111827;
			color: white;
			border-color: #111827;
		}

		.send-btn:hover { background: #1f2937; }

		.status {
			padding: 0 12px 10px 12px;
			font-size: 12px;
			color: var(--muted);
			min-height: 20px;
		}

		.status.error { color: var(--danger); }

		.session-bar {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 0 12px 10px 12px;
			font-size: 12px;
			color: var(--muted);
		}

		.session-bar[hidden] { display: none; }

		.session-bar-label { flex: none; }

		.session-id-value {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 12px;
			color: var(--text);
			background: #f3f4f6;
			border: 1px solid var(--border);
			border-radius: 6px;
			padding: 2px 6px;
			max-width: 260px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.session-copy-btn {
			flex: none;
			padding: 3px 8px;
			font-size: 12px;
		}

		.typing {
			display: inline-flex;
			gap: 4px;
			align-items: center;
		}

		.typing-dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: #64748b;
			animation: pulse 1.2s infinite;
		}

		.typing-dot:nth-child(2) { animation-delay: 0.2s; }
		.typing-dot:nth-child(3) { animation-delay: 0.4s; }

		@keyframes pulse {
			0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
			40% { transform: translateY(-2px); opacity: 1; }
		}

		.settings-backdrop {
			position: fixed;
			inset: 0;
			background: rgba(17, 24, 39, 0.45);
			display: none;
			align-items: center;
			justify-content: center;
			padding: 16px;
			z-index: 10;
		}

		.settings-backdrop.open { display: flex; }

		.settings-modal {
			width: min(500px, 100%);
			background: #fff;
			border-radius: 14px;
			border: 1px solid var(--border);
			padding: 14px;
		}

		.settings-modal h2 {
			margin: 0 0 8px;
			font-size: 16px;
		}

		.settings-help {
			margin: 0 0 12px;
			font-size: 12px;
			color: var(--muted);
		}

		.field {
			display: grid;
			gap: 6px;
			margin-bottom: 10px;
		}

		label { font-size: 12px; color: var(--muted); }

		input {
			width: 100%;
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 9px 10px;
			font-size: 14px;
			outline: none;
		}

		input:focus { border-color: #93c5fd; }
		input.input-error { border-color: var(--danger); }

		.field-error {
			margin: 0;
			font-size: 12px;
			color: var(--danger);
		}

		.field-error[hidden] { display: none; }

		.recent-sessions {
			display: grid;
			gap: 6px;
		}

		.recent-sessions[hidden] { display: none; }

		.recent-sessions select {
			width: 100%;
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 9px 10px;
			font-size: 14px;
			background: #fff;
			outline: none;
		}

		.recent-sessions select:focus { border-color: #93c5fd; }

		.recent-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.recent-actions button { padding: 5px 10px; font-size: 12px; }

		.recent-empty {
			margin: 0;
			font-size: 12px;
			color: var(--muted);
		}

		.recent-empty[hidden] { display: none; }

		.settings-actions {
			display: flex;
			justify-content: flex-end;
			gap: 8px;
			margin-top: 4px;
		}

		.details-backdrop {
			position: fixed;
			inset: 0;
			background: rgba(17, 24, 39, 0.45);
			display: none;
			align-items: center;
			justify-content: center;
			padding: 16px;
			z-index: 11;
		}

		.details-backdrop.open { display: flex; }

		.details-modal {
			width: min(900px, 100%);
			max-height: 85vh;
			background: #fff;
			border-radius: 14px;
			border: 1px solid var(--border);
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.details-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 12px 14px;
			border-bottom: 1px solid var(--border);
		}

		.details-title {
			margin: 0;
			font-size: 15px;
		}

		.details-content {
			overflow: auto;
			padding: 12px 14px;
			display: grid;
			gap: 14px;
		}

		.details-section h3 {
			margin: 0 0 8px;
			font-size: 14px;
		}

		.details-item {
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 9px 10px;
			background: #f8fafc;
			font-size: 13px;
			line-height: 1.45;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.details-item + .details-item { margin-top: 8px; }

		.details-item-title {
			font-size: 12px;
			color: var(--muted);
			margin-bottom: 6px;
		}

		.details-pre {
			margin: 0;
			font-size: 12px;
			line-height: 1.35;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.details-empty {
			font-size: 12px;
			color: var(--muted);
		}
	</style>
</head>
<body>
	<main class="app">
		<header class="topbar">
			<div class="topbar-title">Agent Chat</div>
			<div class="topbar-actions">
				<button id="newSessionBtn" type="button">New session</button>
				<button id="settingsBtn" class="gear-btn" type="button" aria-label="Settings">⚙️</button>
			</div>
		</header>

		<section id="chat" class="chat" aria-live="polite"></section>

		<form id="composer" class="composer">
			<textarea id="promptInput" placeholder="Type your message..." required></textarea>
			<button id="sendBtn" class="send-btn" type="submit">Send</button>
		</form>

		<div id="status" class="status"></div>
		<div id="sessionBar" class="session-bar" hidden>
			<span class="session-bar-label">Session</span>
			<code id="sessionIdValue" class="session-id-value" title="Active session ID"></code>
			<button id="copySessionBtn" class="session-copy-btn" type="button" aria-label="Copy session ID">Copy</button>
		</div>
	</main>

	<div id="settingsBackdrop" class="settings-backdrop" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
		<section class="settings-modal">
			<h2 id="settingsTitle">Connection settings</h2>
			<p class="settings-help">These are saved locally in your browser and can be edited any time from the gear icon.</p>
			<div class="field">
				<label for="baseUrlInput">Base URL</label>
				<input id="baseUrlInput" type="url" placeholder="https://your-function-app.azurewebsites.net" />
			</div>
			<div class="field">
				<label for="keyInput">Function key</label>
				<input id="keyInput" type="password" placeholder="Enter your key (optional on localhost)" />
			</div>
			<div class="field">
				<label for="sessionIdInput">Session ID (optional)</label>
				<input id="sessionIdInput" type="text" placeholder="Paste an ID to resume a conversation" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
				<p id="sessionIdError" class="field-error" hidden></p>
			</div>
			<div class="field" id="recentSessionsField">
				<label for="recentSessionsSelect">Recent sessions</label>
				<div class="recent-sessions" id="recentSessionsControls" hidden>
					<select id="recentSessionsSelect" aria-label="Recent sessions"></select>
					<div class="recent-actions">
						<button id="recentRenameBtn" type="button">Rename</button>
						<button id="recentRemoveBtn" type="button">Remove</button>
						<button id="recentClearBtn" type="button">Clear recent</button>
					</div>
				</div>
				<p id="recentEmpty" class="recent-empty">No recent sessions.</p>
			</div>
			<div class="settings-actions">
				<button id="cancelSettingsBtn" type="button">Cancel</button>
				<button id="saveSettingsBtn" type="button">Save</button>
			</div>
		</section>
	</div>

	<div id="detailsBackdrop" class="details-backdrop" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
		<section class="details-modal">
			<header class="details-header">
				<h2 id="detailsTitle" class="details-title">Agent details</h2>
				<button id="closeDetailsBtn" type="button">Close</button>
			</header>
			<div id="detailsContent" class="details-content"></div>
		</section>
	</div>

	<script>
		const STORAGE_KEYS = {
			baseUrl: "chat.baseUrl",
			key: "chat.key",
			sessionId: "chat.sessionId",
			sessionIdSource: "chat.sessionIdSource",
			recentSessions: "chat.recentSessions"
		};

		const chatEl = document.getElementById("chat");
		const composerEl = document.getElementById("composer");
		const promptInputEl = document.getElementById("promptInput");
		const sendBtnEl = document.getElementById("sendBtn");
		const statusEl = document.getElementById("status");
		const newSessionBtnEl = document.getElementById("newSessionBtn");
		const settingsBtnEl = document.getElementById("settingsBtn");
		const sessionBarEl = document.getElementById("sessionBar");
		const sessionIdValueEl = document.getElementById("sessionIdValue");
		const copySessionBtnEl = document.getElementById("copySessionBtn");

		const settingsBackdropEl = document.getElementById("settingsBackdrop");
		const baseUrlInputEl = document.getElementById("baseUrlInput");
		const keyInputEl = document.getElementById("keyInput");
		const sessionIdInputEl = document.getElementById("sessionIdInput");
		const sessionIdErrorEl = document.getElementById("sessionIdError");
		const recentSessionsFieldEl = document.getElementById("recentSessionsField");
		const recentSessionsControlsEl = document.getElementById("recentSessionsControls");
		const recentSessionsSelectEl = document.getElementById("recentSessionsSelect");
		const recentRenameBtnEl = document.getElementById("recentRenameBtn");
		const recentRemoveBtnEl = document.getElementById("recentRemoveBtn");
		const recentClearBtnEl = document.getElementById("recentClearBtn");
		const recentEmptyEl = document.getElementById("recentEmpty");
		const saveSettingsBtnEl = document.getElementById("saveSettingsBtn");
		const cancelSettingsBtnEl = document.getElementById("cancelSettingsBtn");
		const detailsBackdropEl = document.getElementById("detailsBackdrop");
		const detailsContentEl = document.getElementById("detailsContent");
		const closeDetailsBtnEl = document.getElementById("closeDetailsBtn");
		let currentDetailsSource = null;

		const defaultBaseUrl = `${location.protocol}//${location.host}`;

		function getApiBasePath() {
			// Examples:
			// / -> /agents/main
			// /agents/foo/ -> /agents/foo
			// /api/ -> /api/agents/main
			// /api/agents/foo/ -> /api/agents/foo
			// /api/agents/foo -> /api/agents/foo
			// Match the trailing /agents/{slug} segment while preserving any path prefix
			// (Azure Functions default 'api' prefix, reverse-proxy prefixes, etc.).
			const match = window.location.pathname.match(/^(.*)\/agents\/([^/]+)\/?$/);
			if (match) {
				return `${match[1]}/agents/${match[2]}`;
			}

			if (window.location.pathname === "/") {
				return "/agents/main";
			}

			return window.location.pathname.endsWith("/")
				? `${window.location.pathname}agents/main`
				: `${window.location.pathname}/agents/main`;
		}

		const state = {
			baseUrl: "",
			key: "",
			sessionId: null,
			loading: false,
			settling: false,
			settlementSessionId: null,
			settlementRunId: null,
			settlementLocation: null,
			settlementTimer: null,
			settlementPollInFlight: false,
			loadingTimer: null,
			loadingSeconds: 0
		};

		const TERMINAL_WORKFLOW_STATES = new Set(["Completed", "Failed", "Canceled", "Terminated"]);
		const WORKFLOW_POLL_INTERVAL_MS = 3000;
		const WORKFLOW_POLL_FAILURE_WARN_AT = 3;
		const workflowCards = new Map();
		let workflowPollTimer = null;
		let workflowPollInFlight = false;
		let workflowProbeInFlight = false;
		let workflowPollFailureCount = 0;
		// "unknown" until probed; once "unsupported" we never poll, persist, or
		// claim reconnect for this base URL. Set by either the explicit probe
		// at boot or the first 404/501 from the polling endpoint.
		let workflowsCapability = "unknown";
		// Bumped whenever the app or active session identity changes. Workflow
		// polls capture it and discard responses after a switch.
		let workflowEpoch = 0;

		// --- Workflow auto-notification (terminal-state -> synthetic
		// `<workflow-notification>` user message into the chat). The
		// queue carries enough identity for drain-time checks to drop
		// items belonging to a session/app the user has since moved away
		// from. The drain is single-flight and waits for `state.loading`
		// to fall to false so it never races the user's own turn or a
		// previous auto-notification still streaming.
		const pendingCompletionQueue = [];   // Array<{epoch, baseUrl, sessionId, workflowId, status}>
		let completionDrainInFlight = false;
		// Restored localStorage value held separately from state.sessionId
		// so it doesn't ride along on chat requests for non-workflow apps
		// (where the probe will eventually return 404 and we drop it). Only
		// promoted into state.sessionId after the probe confirms support.
		let restoredSessionIdCandidate = null;
		// Tracks whether the current state.sessionId came from a fresh
		// chatstream `session` event vs. being restored from localStorage.
		// The "Reconnected" greeting / persistence guards branch on this.
		let sessionWasFromServer = false;
		// Set when the user supplies/resumes a session id via Settings.
		// Explicit ids are authoritative: persisted to localStorage
		// unconditionally and restored on reload without waiting for the
		// workflow probe, so resume works for plain (non-workflow) apps too.
		let sessionIdIsExplicit = false;
		// The session id prefilled into Settings the last time it opened,
		// used on save to tell an untouched field from a real resume.
		let settingsSessionIdPrefill = "";
		let restoredGreetingContent = null;
		// The most recent user message text, captured on submit so the
		// server-assigned `session` SSE event can title a fresh id after
		// the fact (the id doesn't exist yet when the message is sent).
		let lastSentUserMessage = "";
		// Every history request captures this generation. Any newer replay or
		// chat activity increments it so a delayed response cannot replace
		// bubbles rendered after that request began.
		let historyReplayGeneration = 0;
		let historyReplayInFlight = false;

		// Mirror the server-side rule enforced by _validate_session_id in
		// runner.py (SESSION_ID_PATTERN in _session_id.py) so the UI never
		// sends an id the server would reject with a 400.
		const SESSION_ID_MAX_LENGTH = 128;
		const SESSION_ID_PATTERN = /^[A-Za-z0-9._-]{1,128}$/;

		function isValidSessionId(value) {
			return typeof value === "string" && SESSION_ID_PATTERN.test(value);
		}

		function buildAuthQuery() {
			return state.key ? `?code=${encodeURIComponent(state.key)}` : "";
		}

		function workflowsAreSupported() {
			return workflowsCapability === "supported";
		}

		function markWorkflowsUnsupported() {
			if (workflowsCapability === "unsupported") return;
			workflowsCapability = "unsupported";
			stopWorkflowPolling();
			// An explicitly-resumed id stays active even without workflow
			// support — plain chat apps honor x-ms-session-id too — so keep
			// it and its stored copy intact.
			if (sessionIdIsExplicit) return;
			restoredSessionIdCandidate = null;
			// Drop any speculatively-restored session id from storage so we
			// don't claim reconnect on the next reload of an app that has
			// no workflow endpoint.
			try { localStorage.removeItem(storageKeyForSessionId()); } catch (_e) {}
		}

		function markWorkflowsSupported() {
			if (workflowsCapability === "supported") return;
			workflowsCapability = "supported";
			// Promote the restored candidate (if any) only now that we
			// know it's safe to attribute to this app.
			if (!state.sessionId && restoredSessionIdCandidate) {
				state.sessionId = restoredSessionIdCandidate;
				sessionWasFromServer = false;
			}
			restoredSessionIdCandidate = null;
			persistSessionId();
			updateSessionBar();
			if (state.sessionId) recordSessionActivity(state.sessionId, "");
			startWorkflowPolling();
		}

		// Cheap non-cryptographic hash — this is just a namespace.
		function hashString(str) {
			let h = 0;
			for (let i = 0; i < str.length; i++) {
				h = ((h << 5) - h + str.charCodeAt(i)) | 0;
			}
			return (h >>> 0).toString(36);
		}

		// Namespace localStorage by BOTH the target base URL and the specific
		// agent path (e.g. /agents/foo), so multiple deployments — and multiple
		// agents served from the same host — don't collide on chat.sessionId,
		// its source marker, or the Recent Sessions list.
		function storageNamespace() {
			if (!state.baseUrl) return "default";
			return hashString(`${state.baseUrl}|${getApiBasePath()}`);
		}

		function storageKeyForSessionId() {
			const ns = storageNamespace();
			return `${STORAGE_KEYS.sessionId}.${ns}`;
		}

		function storageKeyForSessionIdSource() {
			const ns = storageNamespace();
			return `${STORAGE_KEYS.sessionIdSource}.${ns}`;
		}

		// ---- Recent sessions (per-{baseUrl, agent} MRU list) -------------
		// A purely client-side convenience: the runtime has no session
		// directory or title concept, so this list lives only in this
		// browser's localStorage, namespaced like the active-id keys above.
		const RECENT_SESSIONS_MAX = 8;
		const SESSION_TITLE_MAX_LENGTH = 40;
		// Defensive cap so a corrupt/oversized value can't be parsed.
		const RECENT_SESSIONS_MAX_BYTES = 50000;

		function storageKeyForRecentSessions() {
			const ns = storageNamespace();
			return `${STORAGE_KEYS.recentSessions}.${ns}`;
		}

		function collapseWhitespace(text) {
			return String(text == null ? "" : text).replace(/\s+/g, " ").trim();
		}

		function deriveSessionTitle(text) {
			const clean = collapseWhitespace(text);
			if (!clean) return "";
			if (clean.length <= SESSION_TITLE_MAX_LENGTH) return clean;
			return `${clean.slice(0, SESSION_TITLE_MAX_LENGTH - 1).trimEnd()}\u2026`;
		}

		function shortSessionId(id) {
			return id.length > 8 ? `${id.slice(0, 8)}\u2026` : id;
		}

		function recentSessionLabel(entry) {
			const title = entry && typeof entry.title === "string" ? entry.title : "";
			return title ? `${title} \u2014 ${shortSessionId(entry.id)}` : shortSessionId(entry.id);
		}

		// Read + sanitize the MRU list. Never throws: malformed, oversized,
		// or wrong-shape data yields an empty list. Every id must pass the
		// same validator we use before an id can enter state.
		function readRecentSessions() {
			try {
				const raw = localStorage.getItem(storageKeyForRecentSessions());
				if (!raw || raw.length > RECENT_SESSIONS_MAX_BYTES) return [];
				const parsed = JSON.parse(raw);
				if (!Array.isArray(parsed)) return [];
				const seen = new Set();
				const list = [];
				for (const item of parsed) {
					if (!item || typeof item !== "object") continue;
					const id = item.id;
					if (!isValidSessionId(id) || seen.has(id)) continue;
					seen.add(id);
					list.push({
						id,
						title: typeof item.title === "string" ? item.title : "",
						lastUsed: Number.isFinite(item.lastUsed) ? item.lastUsed : 0
					});
				}
				list.sort((a, b) => b.lastUsed - a.lastUsed);
				return list.slice(0, RECENT_SESSIONS_MAX);
			} catch (_e) {
				return [];
			}
		}

		function writeRecentSessions(list) {
			try {
				const trimmed = list.slice(0, RECENT_SESSIONS_MAX);
				localStorage.setItem(storageKeyForRecentSessions(), JSON.stringify(trimmed));
			} catch (_e) {
				// Storage full / disabled — the MRU list is best-effort.
			}
		}

		// Record that `id` is active or just took a turn. Local only: this
		// never promotes an id into state or bypasses the workflow probe.
		// Titles are set from the first message and never overwritten, so
		// an explicit rename sticks.
		function recordSessionActivity(id, messageText) {
			if (!isValidSessionId(id)) return;
			const list = readRecentSessions();
			const now = Date.now();
			const idx = list.findIndex((e) => e.id === id);
			if (idx === -1) {
				list.unshift({ id, title: deriveSessionTitle(messageText), lastUsed: now });
			} else {
				const entry = list[idx];
				if (!entry.title) {
					const title = deriveSessionTitle(messageText);
					if (title) entry.title = title;
				}
				entry.lastUsed = now;
			}
			list.sort((a, b) => b.lastUsed - a.lastUsed);
			writeRecentSessions(list);
			renderRecentSessions();
		}

		function renameRecentSession(id, title) {
			const list = readRecentSessions();
			const entry = list.find((e) => e.id === id);
			if (!entry) return;
			entry.title = collapseWhitespace(title).slice(0, 80);
			writeRecentSessions(list);
		}

		function removeRecentSession(id) {
			writeRecentSessions(readRecentSessions().filter((e) => e.id !== id));
		}

		function clearRecentSessions() {
			try {
				localStorage.removeItem(storageKeyForRecentSessions());
			} catch (_e) {}
		}

		// One-time seed: if the active-id keys exist from before this list
		// was introduced (or from Phase 1), surface that id in the list so
		// it isn't invisible. Leaves the active-id keys untouched.
		function migrateRecentSessions() {
			try {
				if (localStorage.getItem(storageKeyForRecentSessions()) != null) return;
				const stored = (localStorage.getItem(storageKeyForSessionId()) || "").trim();
				if (isValidSessionId(stored)) {
					writeRecentSessions([{ id: stored, title: "", lastUsed: Date.now() }]);
				}
			} catch (_e) {}
		}

		// Rebuild the Recent-sessions <select>. `selectedId` keeps a given
		// entry highlighted (used after rename); otherwise it resets to the
		// placeholder so a re-open doesn't silently re-arm a resume.
		function renderRecentSessions(selectedId = "") {
			if (!recentSessionsSelectEl) return;
			const list = readRecentSessions();
			recentSessionsSelectEl.textContent = "";
			const placeholder = document.createElement("option");
			placeholder.value = "";
			placeholder.textContent = "Select a recent session\u2026";
			recentSessionsSelectEl.appendChild(placeholder);
			for (const entry of list) {
				const option = document.createElement("option");
				option.value = entry.id;
				option.textContent = recentSessionLabel(entry);
				recentSessionsSelectEl.appendChild(option);
			}
			const hasEntries = list.length > 0;
			if (recentSessionsControlsEl) recentSessionsControlsEl.hidden = !hasEntries;
			if (recentEmptyEl) recentEmptyEl.hidden = hasEntries;
			recentSessionsSelectEl.value = selectedId && list.some((e) => e.id === selectedId)
				? selectedId
				: "";
		}

		function loadRestoredSessionCandidate() {
			// Called after BOTH loadSettings() and loadSettingsFromHash()
			// have finalized state.baseUrl, so the namespace key matches
			// the app we're actually about to talk to.
			try {
				const stored = (localStorage.getItem(storageKeyForSessionId()) || "").trim();
				const source = localStorage.getItem(storageKeyForSessionIdSource());
				if (stored && source === "explicit" && isValidSessionId(stored)) {
					// A user-supplied id is authoritative and durable for
					// every app type, so activate it immediately instead of
					// waiting for the workflow probe to promote a candidate.
					state.sessionId = stored;
					sessionIdIsExplicit = true;
					sessionWasFromServer = false;
					restoredSessionIdCandidate = null;
					recordSessionActivity(stored, "");
				} else {
					restoredSessionIdCandidate = stored && isValidSessionId(stored) ? stored : null;
				}
			} catch (_e) {
				restoredSessionIdCandidate = null;
			}
			updateSessionBar();
		}

		// Reflect the active session id in the always-visible bar under the
		// status line so users can see and copy the id at any time.
		function updateSessionBar() {
			if (!sessionBarEl || !sessionIdValueEl) return;
			if (state.sessionId) {
				sessionIdValueEl.textContent = state.sessionId;
				sessionIdValueEl.title = state.sessionId;
				sessionBarEl.hidden = false;
			} else {
				sessionIdValueEl.textContent = "";
				sessionBarEl.hidden = true;
			}
		}

		async function copySessionId() {
			if (!state.sessionId) return;
			const id = state.sessionId;
			let copied = false;
			try {
				if (navigator.clipboard && navigator.clipboard.writeText) {
					await navigator.clipboard.writeText(id);
					copied = true;
				}
			} catch (_e) {
				copied = false;
			}
			if (!copied) {
				// Fallback for non-secure contexts / older browsers where
				// the async clipboard API is unavailable.
				try {
					const ta = document.createElement("textarea");
					ta.value = id;
					ta.setAttribute("readonly", "");
					ta.style.position = "absolute";
					ta.style.left = "-9999px";
					document.body.appendChild(ta);
					ta.select();
					copied = document.execCommand("copy");
					document.body.removeChild(ta);
				} catch (_e) {
					copied = false;
				}
			}
			setStatus(
				copied
					? "Session ID copied to clipboard."
					: "Copy failed — select the ID and copy it manually.",
				!copied
			);
		}

		// Per-{baseUrl, sessionId} record of workflow ids we've already
		// notified the agent about. Persisted in sessionStorage so a page
		// refresh after a workflow completed (and the agent already
		// summarized) does not re-fire the synthetic notification turn.
		// `notifiedWorkflowsStorageKey()` returns null until both
		// state.baseUrl and state.sessionId are set; callers tolerate that
		// (no-op load returns empty, no-op persist drops the write).
		function notifiedWorkflowsStorageKey() {
			if (!state.baseUrl || !state.sessionId) return null;
			return `chat.notifiedWorkflows.${storageNamespace()}.${state.sessionId}`;
		}

		function loadNotifiedWorkflowIds() {
			const key = notifiedWorkflowsStorageKey();
			if (!key) return new Set();
			try {
				const raw = sessionStorage.getItem(key);
				if (!raw) return new Set();
				const arr = JSON.parse(raw);
				return new Set(Array.isArray(arr) ? arr : []);
			} catch (_e) {
				return new Set();
			}
		}

		function persistNotifiedWorkflowId(workflowId) {
			const key = notifiedWorkflowsStorageKey();
			if (!key) return;
			try {
				const set = loadNotifiedWorkflowIds();
				set.add(workflowId);
				// Cap to bound storage growth across long-lived sessions.
				const arr = Array.from(set).slice(-200);
				sessionStorage.setItem(key, JSON.stringify(arr));
			} catch (_e) { /* quota exceeded — non-fatal */ }
		}

		function truncateId(id) {
			if (!id) return "";
			return id.length > 14 ? `${id.slice(0, 6)}…${id.slice(-4)}` : id;
		}

		function renderTaskResults(results) {
			if (!results || typeof results !== "object") return "";
			const entries = Object.entries(results);
			if (!entries.length) return "";
			const rows = entries.map(([taskId, result]) => {
				const summary = typeof result === "string"
					? result
					: JSON.stringify(result);
				const truncated = summary.length > 120 ? `${summary.slice(0, 117)}…` : summary;
				return `<li><span class="workflow-task-id">${escapeHtml(taskId)}</span> <span class="workflow-task-result">${escapeHtml(truncated)}</span></li>`;
			}).join("");
			return `<ul class="workflow-card-tasks">${rows}</ul>`;
		}

		function renderWorkflowCard(entry, envelope) {
			const status = String(envelope.runtime_status || "Pending");
			const terminal = TERMINAL_WORKFLOW_STATES.has(status);
			const card = entry.card;

			// Whitelist class suffixes so a stray runtime_status from a
			// future Durable version can't poison our class name.
			const knownStatuses = new Set([
				"Pending", "Running", "Completed", "Failed",
				"Canceled", "Terminated", "ContinuedAsNew", "Suspended"
			]);
			const statusClass = knownStatuses.has(status) ? status : "Unknown";
			card.className = `workflow-card terminal-${statusClass}`;

			const custom = String(envelope.custom_status ?? "");
			const taskResults = envelope.output && typeof envelope.output === "object"
				? envelope.output.results
				: null;
			const tasksHtml = renderTaskResults(taskResults);
			const rawOutputText = !tasksHtml && envelope.output !== undefined && envelope.output !== null
				? JSON.stringify(envelope.output, null, 2)
				: "";

			const chipIcon = terminal
				? (status === "Completed" ? "✓" : status === "Failed" ? "✕" : "⏹")
				: '<span class="workflow-card-spinner" aria-hidden="true"></span>';

			card.innerHTML = `
				<div class="workflow-card-header">
					<span class="workflow-card-chip">${chipIcon} ${escapeHtml(status)}</span>
					<span>Workflow</span>
					<span class="workflow-card-id">${escapeHtml(truncateId(envelope.workflow_id))}</span>
				</div>
				${custom ? `<div class="workflow-card-custom-status">${escapeHtml(custom)}</div>` : ""}
				${tasksHtml}
				${rawOutputText ? `<pre class="workflow-card-output">${escapeHtml(rawOutputText)}</pre>` : ""}
			`;

			entry.status = status;
			entry.terminal = terminal;
		}

		function upsertWorkflowCard(envelope) {
			const wid = envelope.workflow_id;
			if (!wid) return;
			let entry = workflowCards.get(wid);
			if (!entry) {
				const wrap = document.createElement("div");
				wrap.className = "bubble-wrap copilot";
				const card = document.createElement("div");
				card.className = "workflow-card";
				card.setAttribute("role", "status");
				card.setAttribute("aria-live", "polite");
				wrap.appendChild(card);
				chatEl.appendChild(wrap);
				entry = { wrap, card, status: null, terminal: false, lastUpdated: null, notifyState: "unseen" };
				workflowCards.set(wid, entry);
				// If this workflow is in our persisted notified-set
				// (e.g. user refreshed after the summary turn already
				// landed), pre-mark as 'sent' so we don't re-fire the
				// notification. A fast workflow that started+finished
				// within one 3s poll will NOT be in the set yet, so it
				// still gets a notification — that's the case we care
				// about.
				if (loadNotifiedWorkflowIds().has(wid)) {
					entry.notifyState = "sent";
				}
			}
			const status = String(envelope.runtime_status || "Pending");
			const terminal = TERMINAL_WORKFLOW_STATES.has(status);
			// Idempotent render: skip when nothing visibly changed AND
			// we've already settled the notify state for this entry.
			if (
				entry.terminal &&
				entry.lastUpdated === envelope.last_updated_time &&
				entry.notifyState !== "unseen"
			) {
				return;
			}
			entry.lastUpdated = envelope.last_updated_time;
			renderWorkflowCard(entry, envelope);

			// Auto-notification: enqueue once per workflow, the first time
			// we see it in a terminal state. The persisted notified-set
			// (above) guards against re-firing on page refresh; the
			// `unseen` -> `queued` transition guards against re-enqueueing
			// across multiple poll cycles within a single page lifetime.
			if (terminal && entry.notifyState === "unseen") {
				entry.notifyState = "queued";
				pendingCompletionQueue.push({
					epoch: workflowEpoch,
					baseUrl: state.baseUrl,
					sessionId: state.sessionId,
					workflowId: wid,
					status
				});
				drainCompletionQueueIfIdle();
			}
		}

		function workflowIdentityIsCurrent(epoch, baseUrl, sessionId) {
			return epoch === workflowEpoch
				&& baseUrl === state.baseUrl
				&& sessionId === state.sessionId;
		}

		function resetWorkflowStateForSessionChange() {
			workflowEpoch += 1;
			stopWorkflowPolling();
			resetWorkflowCards();
			workflowPollFailureCount = 0;
		}

		function clearRunSettlement() {
			if (state.settlementTimer) {
				clearTimeout(state.settlementTimer);
				state.settlementTimer = null;
			}
			state.settling = false;
			state.settlementSessionId = null;
			state.settlementRunId = null;
			state.settlementLocation = null;
			state.settlementPollInFlight = false;
			updateComposerAvailability();
		}

		function updateComposerAvailability() {
			const unavailable = state.loading || state.settling;
			sendBtnEl.disabled = unavailable;
			promptInputEl.disabled = unavailable;
		}

		async function pollWorkflowsOnce() {
			if (workflowPollInFlight) return;
			if (workflowsCapability !== "supported") return;
			if (!state.sessionId || !state.baseUrl) return;
			if (document.visibilityState !== "visible") return;
			workflowPollInFlight = true;
			const epoch = workflowEpoch;
			const baseUrl = state.baseUrl;
			const sessionId = state.sessionId;
			try {
				const headers = { "x-ms-session-id": sessionId };
				const resp = await fetch(`${baseUrl}${getApiBasePath()}/workflows${buildAuthQuery()}`, { headers });
				// Discard stale responses from a prior app or session.
				if (!workflowIdentityIsCurrent(epoch, baseUrl, sessionId)) return;
				// 404 / 405 / 501 → endpoint genuinely not present. Stop forever.
				if (resp.status === 404 || resp.status === 405 || resp.status === 501) {
					markWorkflowsUnsupported();
					return;
				}
				if (!resp.ok) {
					workflowPollFailureCount += 1;
					if (workflowPollFailureCount === WORKFLOW_POLL_FAILURE_WARN_AT) {
						console.warn(`workflow polling: ${workflowPollFailureCount} consecutive non-OK responses (last status ${resp.status})`);
					}
					return;
				}
				workflowPollFailureCount = 0;
				const body = await resp.json();
				if (!workflowIdentityIsCurrent(epoch, baseUrl, sessionId)) return;
				const workflows = Array.isArray(body?.workflows) ? body.workflows : [];
				for (const wf of workflows) {
					upsertWorkflowCard(wf);
				}
			} catch (err) {
				if (!workflowIdentityIsCurrent(epoch, baseUrl, sessionId)) return;
				workflowPollFailureCount += 1;
				if (workflowPollFailureCount === WORKFLOW_POLL_FAILURE_WARN_AT) {
					console.warn(`workflow polling: ${workflowPollFailureCount} consecutive failures`, err);
				}
			} finally {
				workflowPollInFlight = false;
			}
		}

		function startWorkflowPolling() {
			// Hard gates: don't run a useless timer for non-workflow apps,
			// don't run before capability is confirmed, don't run without a
			// session, and don't run on a hidden tab.
			if (workflowsCapability !== "supported") return;
			if (!state.sessionId) return;
			if (historyReplayInFlight) return;
			if (workflowPollTimer !== null) return;
			if (document.visibilityState !== "visible") return;
			pollWorkflowsOnce();
			workflowPollTimer = setInterval(pollWorkflowsOnce, WORKFLOW_POLL_INTERVAL_MS);
		}

		function stopWorkflowPolling() {
			if (workflowPollTimer !== null) {
				clearInterval(workflowPollTimer);
				workflowPollTimer = null;
			}
		}

		function resetWorkflowCards() {
			// Remove DOM nodes alongside the map entries; a bare clear()
			// would leave stale workflow cards visible after a session
			// reset / base-URL change.
			for (const entry of workflowCards.values()) {
				if (entry.wrap && entry.wrap.parentNode) {
					entry.wrap.parentNode.removeChild(entry.wrap);
				}
			}
			workflowCards.clear();
			// Drop any queued auto-notifications. If a notification was
			// in-flight, the drain function's epoch/identity guards
			// already prevent it from mutating the new session's state.
			pendingCompletionQueue.length = 0;
			completionDrainInFlight = false;
		}

		// --- Auto-notification: drain & send ---
		// When a workflow we're tracking transitions to a terminal state,
		// `upsertWorkflowCard` enqueues a notification record.
		// `drainCompletionQueueIfIdle` waits for the chat to be idle
		// (no in-flight user turn or earlier auto-notification turn) and
		// then synthesizes a `<workflow-notification>` user turn against
		// the current agent chatstream endpoint, batching all currently-queued completions
		// for the active session into one prompt. Identity (epoch,
		// baseUrl, sessionId) is checked at drain time so a queued item
		// from a previous session/app is dropped silently — never sent.

		function dropStaleQueueEntries() {
			for (let i = pendingCompletionQueue.length - 1; i >= 0; i--) {
				const it = pendingCompletionQueue[i];
				if (
					it.epoch !== workflowEpoch ||
					it.baseUrl !== state.baseUrl ||
					it.sessionId !== state.sessionId
				) {
					pendingCompletionQueue.splice(i, 1);
				}
			}
		}

		function drainCompletionQueueIfIdle() {
			if (completionDrainInFlight) return;
			if (state.loading) return;
			if (!state.sessionId || !state.baseUrl) return;
			if (workflowsCapability !== "supported") return;
			dropStaleQueueEntries();
			if (pendingCompletionQueue.length === 0) return;

			// Batch all currently-queued items into one synthetic turn.
			const batch = pendingCompletionQueue.splice(0, pendingCompletionQueue.length);
			for (const it of batch) {
				const entry = workflowCards.get(it.workflowId);
				if (entry) entry.notifyState = "inflight";
			}
			completionDrainInFlight = true;
			sendCompletionNotification(batch).finally(() => {
				completionDrainInFlight = false;
				// If more landed during the turn, drain them too.
				drainCompletionQueueIfIdle();
			});
		}

		function buildCompletionNotificationPrompt(batch) {
			// Informational, not instructional. The system-prompt addendum
			// owns the contract (summary-only, race handling, etc.). Per
			// turn we just hand the model the data — matching the claurst
			// project's `<task-notification>` shape
			// (https://github.com/Kuberwastaken/claurst) — and one short
			// reminder of how to fetch the result.
			const envelopes = batch.map(it => (
				"<workflow-notification>\n" +
				`  <workflow-id>${escapeXml(it.workflowId)}</workflow-id>\n` +
				`  <status>${escapeXml(it.status)}</status>\n` +
				`  <summary>Workflow ${escapeXml(it.workflowId)} finished with status ${escapeXml(it.status)}.</summary>\n` +
				"</workflow-notification>"
			));
			const reminder = batch.length === 1
				? "Call `get_workflow_status` to retrieve the final result."
				: "Call `get_workflow_status` for each `<workflow-id>` to retrieve the final result(s).";
			return envelopes.join("\n") + "\n\n" + reminder;
		}

		function escapeXml(value) {
			return String(value)
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;");
		}

		function renderAutoNotificationBubble(batch, rawPrompt) {
			const wrap = document.createElement("div");
			wrap.className = "bubble-wrap auto";
			const bubble = document.createElement("div");
			bubble.className = "bubble auto";
			const summary = batch.length === 1
				? `⚙ Workflow <code>${escapeHtml(truncateId(batch[0].workflowId))}</code> finished (${escapeHtml(batch[0].status)}) — notifying the assistant`
				: `⚙ ${batch.length} workflows finished — notifying the assistant`;
			// Single-line layout: body text + inline disclosure trigger.
			// The <pre> only appears (as a block) when the user opens it.
			bubble.innerHTML = `<span class="auto-notification-body">${summary}</span><details class="auto-notification-raw"><summary>show prompt</summary><pre>${escapeHtml(rawPrompt)}</pre></details>`;
			wrap.appendChild(bubble);
			chatEl.appendChild(wrap);
			scrollChatToBottom();
			return { wrap, bubble };
		}

		async function sendCompletionNotification(batch) {
			// Capture identity at send time. If anything moves under us
			// while the synthetic turn streams, the response handlers
			// will still complete normally — we just won't persist into
			// stale namespaces (notifiedWorkflowsStorageKey() reads the
			// current state, so a session-flip mid-flight would write
			// to the new namespace; that's tolerable since the only
			// observable effect is one extra notification on the
			// previous app, which we already dropped from the DOM).
			const prompt = buildCompletionNotificationPrompt(batch);
			invalidateHistoryReplay();
			startWorkflowPolling();
			renderAutoNotificationBubble(batch, prompt);

			setLoading(true, { showWaitingBubble: false });
			const streamingBubble = renderBubble("copilot", "", "Copilot • streaming...");
			const liveDetails = { responseIntermediate: [], toolCalls: [] };

			try {
				let currentToolCount = 0;
				let currentIntermediateCount = 0;
				const updateStreamingMeta = () => {
					const segments = ["Copilot", "streaming..."];
					if (currentToolCount > 0) {
						segments.push(`${currentToolCount} tool call${currentToolCount === 1 ? "" : "s"}`);
					}
					if (currentIntermediateCount > 0) {
						segments.push(`${currentIntermediateCount} intermediate${currentIntermediateCount === 1 ? "" : "s"}`);
					}
					setBubbleMeta(streamingBubble.bubble, segments.join(" • "));
				};

				const result = await sendMessage(prompt, {
					onDelta: (text) => {
						setBubbleText(streamingBubble.bubble, "copilot", text);
						scrollChatToBottom();
					},
					onToolCount: (count) => {
						currentToolCount = count;
						updateStreamingMeta();
					},
					onIntermediate: (count, responses) => {
						currentIntermediateCount = count;
						updateStreamingMeta();
						setBubbleIntermediates(streamingBubble.bubble, responses);
						scrollChatToBottom();
					},
					onDetailsUpdate: (snap) => {
						const normalizedLive = normalizeDetails(snap);
						liveDetails.responseIntermediate = normalizedLive.responseIntermediate;
						liveDetails.toolCalls = normalizedLive.toolCalls;
						attachBubbleDetails(streamingBubble.bubble, liveDetails);
						refreshOpenDetails(liveDetails);
					}
				});
				const copilotMeta = hasDetails(result.details)
					? "Copilot • click bubble for details"
					: "Copilot";
				setBubbleText(streamingBubble.bubble, "copilot", result.text);
				setBubbleIntermediates(streamingBubble.bubble, []);
				setBubbleMeta(streamingBubble.bubble, copilotMeta);
				liveDetails.responseIntermediate = result.details.responseIntermediate;
				liveDetails.toolCalls = result.details.toolCalls;
				attachBubbleDetails(streamingBubble.bubble, liveDetails);
				refreshOpenDetails(liveDetails);

				// Persist + mark each batch item as 'sent'. Persist is
				// keyed on the *current* {baseUrl, sessionId}; if those
				// changed mid-stream the write either fails (no key) or
				// writes into the new namespace, which is fine — we
				// already dropped the cards from the DOM.
				for (const it of batch) {
					const entry = workflowCards.get(it.workflowId);
					if (entry) entry.notifyState = "sent";
					persistNotifiedWorkflowId(it.workflowId);
				}
				if (result.sessionId) {
					setStatus(`Connected • Session ${result.sessionId}`);
				} else {
					setStatus("Connected");
				}
				if (result.runMetadata) {
					beginRunSettlement(result.runMetadata);
				}
			} catch (error) {
				setBubbleText(streamingBubble.bubble, "copilot", `Auto-notification failed. ${error.message}`);
				setBubbleIntermediates(streamingBubble.bubble, []);
				setBubbleMeta(streamingBubble.bubble, "Copilot");
				attachBubbleDetails(streamingBubble.bubble, null);
				for (const it of batch) {
					const entry = workflowCards.get(it.workflowId);
					if (entry) entry.notifyState = "failed";
				}
				setStatus(error.message, true);
			} finally {
				setLoading(false);
				promptInputEl.focus();
			}
		}

		// One-shot capability probe: tries the workflows endpoint to learn
		// whether the server registered the route. Status code distinguishes
		// "endpoint exists" (200) from "feature off" (404/405/501). We
		// deliberately don't drain the response body here — we just settle
		// the capability flag and let the immediately-following call to
		// pollWorkflowsOnce() do the drain using whichever session id is
		// authoritative by then. That removes a race where a server-fresh
		// session arrives during the probe and the probe's response body
		// would otherwise paint cards for the now-discarded candidate.
		// Single-flight via workflowProbeInFlight.
		async function probeWorkflowsCapability() {
			if (!state.baseUrl) return;
			if (workflowsCapability !== "unknown") return;
			if (workflowProbeInFlight) return;
			workflowProbeInFlight = true;
			const baseUrl = state.baseUrl;
			// Send the candidate header so the server can short-circuit
			// auth checks identically to a real poll. The body is ignored.
			const probeSessionId = state.sessionId || restoredSessionIdCandidate;
			try {
				const headers = probeSessionId ? { "x-ms-session-id": probeSessionId } : {};
				const resp = await fetch(`${baseUrl}${getApiBasePath()}/workflows${buildAuthQuery()}`, { headers });
				// Capability belongs to the app, not a session. A session switch
				// can reuse this result; a base-URL switch cannot.
				if (baseUrl !== state.baseUrl) return;
				if (resp.status === 404 || resp.status === 405 || resp.status === 501) {
					markWorkflowsUnsupported();
					return;
				}
				if (!resp.ok) {
					// Ambiguous (auth, 500, etc.) — leave capability "unknown"
					// so the next user action can re-trigger probing.
					return;
				}
				const hadCandidateButNoServerSession =
					!state.sessionId && Boolean(restoredSessionIdCandidate);
				markWorkflowsSupported();
				if (hadCandidateButNoServerSession && state.sessionId && !sessionWasFromServer) {
					setStatus("Reconnected to existing session.");
					if (restoredGreetingContent) {
						restoredGreetingContent.textContent =
							"Welcome back — reconnected to your previous session. Active workflows will appear below within a few seconds.";
					}
				}
			} catch (_err) {
				// Network error during probe — leave capability "unknown" so
				// the next user action can re-trigger it.
			} finally {
				workflowProbeInFlight = false;
			}
		}

		document.addEventListener("visibilitychange", () => {
			if (document.visibilityState === "visible") {
				startWorkflowPolling();
			} else {
				stopWorkflowPolling();
			}
		});

		function escapeHtml(value) {
			return value
				.replaceAll("&", "&amp;")
				.replaceAll("<", "&lt;")
				.replaceAll(">", "&gt;")
				.replaceAll('"', "&quot;")
				.replaceAll("'", "&#039;");
		}

		function renderInlineMarkdown(text) {
			let content = text;
			content = content.replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>');
			content = content.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
			content = content.replace(/\*([^*]+)\*/g, "<em>$1</em>");
			content = content.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
			return content;
		}

		function renderMarkdownBasic(markdown) {
			const safeMarkdown = escapeHtml(String(markdown || "")).replace(/\r\n?/g, "\n");
			const codeBlocks = [];

			const withPlaceholders = safeMarkdown.replace(/```[^\n]*\n?([\s\S]*?)```/g, (_match, code) => {
				const token = `@@CODEBLOCK_${codeBlocks.length}@@`;
				codeBlocks.push(`<pre class="md-pre"><code>${code.trimEnd()}</code></pre>`);
				return token;
			});

			const lines = withPlaceholders.split("\n");
			const html = [];
			let inUnorderedList = false;
			let inOrderedList = false;

			const splitTableRow = (line) => {
				const normalized = line.trim().replace(/^\|/, "").replace(/\|$/, "");
				if (!normalized.includes("|")) return null;
				return normalized.split("|").map((cell) => cell.trim());
			};

			const isTableSeparator = (line) => {
				const cells = splitTableRow(line);
				if (!cells || cells.length < 2) return false;
				return cells.every((cell) => /^:?-{3,}:?$/.test(cell));
			};

			const renderTable = (headerCells, bodyRows) => {
				const thead = `<thead><tr>${headerCells.map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`).join("")}</tr></thead>`;
				const tbodyRows = bodyRows
					.map((row) => `<tr>${row.map((cell) => `<td>${renderInlineMarkdown(cell)}</td>`).join("")}</tr>`)
					.join("");
				return `<div class="md-table-wrap"><table class="md-table">${thead}<tbody>${tbodyRows}</tbody></table></div>`;
			};

			const closeLists = () => {
				if (inUnorderedList) {
					html.push("</ul>");
					inUnorderedList = false;
				}
				if (inOrderedList) {
					html.push("</ol>");
					inOrderedList = false;
				}
			};

			for (let i = 0; i < lines.length; i += 1) {
				const rawLine = lines[i];
				const line = rawLine.trim();

				if (!line) {
					closeLists();
					continue;
				}

				if (/^@@CODEBLOCK_\d+@@$/.test(line)) {
					closeLists();
					html.push(line);
					continue;
				}

				const headingMatch = line.match(/^(#{1,6})\s+(.+)$/);
				if (headingMatch) {
					closeLists();
					const level = headingMatch[1].length;
					html.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
					continue;
				}

				const nextLine = (lines[i + 1] || "").trim();
				const headerCells = splitTableRow(line);
				if (headerCells && isTableSeparator(nextLine) && headerCells.length >= 2) {
					closeLists();
					const bodyRows = [];
					i += 2;
					for (; i < lines.length; i += 1) {
						const rowLine = lines[i].trim();
						if (!rowLine) {
							break;
						}
						const rowCells = splitTableRow(rowLine);
						if (!rowCells) {
							i -= 1;
							break;
						}
						bodyRows.push(rowCells);
					}

					html.push(renderTable(headerCells, bodyRows));
					continue;
				}

				const unorderedMatch = line.match(/^[-*]\s+(.+)$/);
				if (unorderedMatch) {
					if (inOrderedList) {
						html.push("</ol>");
						inOrderedList = false;
					}
					if (!inUnorderedList) {
						html.push("<ul>");
						inUnorderedList = true;
					}
					html.push(`<li>${renderInlineMarkdown(unorderedMatch[1])}</li>`);
					continue;
				}

				const orderedMatch = line.match(/^\d+\.\s+(.+)$/);
				if (orderedMatch) {
					if (inUnorderedList) {
						html.push("</ul>");
						inUnorderedList = false;
					}
					if (!inOrderedList) {
						html.push("<ol>");
						inOrderedList = true;
					}
					html.push(`<li>${renderInlineMarkdown(orderedMatch[1])}</li>`);
					continue;
				}

				closeLists();
				html.push(`<p>${renderInlineMarkdown(line)}</p>`);
			}

			closeLists();

			const rendered = html.join("").replace(/@@CODEBLOCK_(\d+)@@/g, (_match, index) => {
				return codeBlocks[Number(index)] || "";
			});

			return rendered || "<p></p>";
		}

		function setStatus(message = "", isError = false) {
			statusEl.textContent = message;
			statusEl.classList.toggle("error", Boolean(isError));
		}

		function scrollChatToBottom() {
			chatEl.scrollTop = chatEl.scrollHeight;
		}

		function scrollToBubbleTop(bubbleWrapEl) {
			if (!bubbleWrapEl) return;
			const topOffset = bubbleWrapEl.offsetTop - chatEl.offsetTop;
			chatEl.scrollTop = Math.max(0, topOffset - 8);
		}

		function renderDetailsSection(title) {
			const section = document.createElement("section");
			section.className = "details-section";
			const heading = document.createElement("h3");
			heading.textContent = title;
			section.appendChild(heading);
			return section;
		}

		function toPrettyJson(value) {
			try {
				return JSON.stringify(value ?? {}, null, 2);
			} catch {
				return String(value);
			}
		}

		function normalizeIntermediateResponses(values) {
			const input = Array.isArray(values) ? values : [];
			const result = [];

			for (const value of input) {
				if (typeof value !== "string") continue;
				if (!value) continue;
				result.push(value);
			}

			return result;
		}

		function getToolCallKey(toolCall) {
			if (toolCall?.event_id) return `event:${toolCall.event_id}`;
			const argsKey = toPrettyJson(toolCall?.arguments || {});
			return [
				toolCall?.tool_call_id || "",
				toolCall?.parent_tool_call_id || "",
				toolCall?.tool_name || "",
				toolCall?.timestamp || "",
				argsKey
			].join("|");
		}

		function normalizeToolCalls(values) {
			const input = Array.isArray(values) ? values : [];
			const seen = new Set();
			const result = [];

			for (const item of input) {
				const key = getToolCallKey(item);
				if (seen.has(key)) continue;
				seen.add(key);
				result.push(item);
			}

			return result;
		}

		function normalizeDetails(details) {
			return {
				responseIntermediate: normalizeIntermediateResponses(details?.responseIntermediate),
				toolCalls: normalizeToolCalls(details?.toolCalls)
			};
		}

		function hasDetails(details) {
			if (!details) return false;
			const normalized = normalizeDetails(details);
			const intermediates = normalized.responseIntermediate;
			const toolCalls = normalized.toolCalls;
			return intermediates.length > 0 || toolCalls.length > 0;
		}

		function showDetails(details) {
			currentDetailsSource = details;
			detailsContentEl.innerHTML = "";
			const normalized = normalizeDetails(details);

			const intermediates = normalized.responseIntermediate;
			const toolCalls = normalized.toolCalls;

			const intermediatesSection = renderDetailsSection("Reasoning");
			if (intermediates.length === 0) {
				const empty = document.createElement("div");
				empty.className = "details-empty";
				empty.textContent = "No reasoning trace in this message.";
				intermediatesSection.appendChild(empty);
			} else {
				const item = document.createElement("div");
				item.className = "details-item";
				const content = document.createElement("div");
				content.style.whiteSpace = "pre-wrap";
				content.textContent = intermediates.join("");
				item.appendChild(content);
				intermediatesSection.appendChild(item);
			}

			const toolsSection = renderDetailsSection("Tool calls");
			if (toolCalls.length === 0) {
				const empty = document.createElement("div");
				empty.className = "details-empty";
				empty.textContent = "No tool calls in this message.";
				toolsSection.appendChild(empty);
			} else {
				toolCalls.forEach((toolCall, index) => {
					const item = document.createElement("div");
					item.className = "details-item";

					const ts = toolCall?.timestamp ? ` • ${toolCall.timestamp}` : "";
					const title = document.createElement("div");
					title.className = "details-item-title";
					title.textContent = `${index + 1}. ${toolCall?.tool_name || "(unknown tool)"}${ts}`;

					const pre = document.createElement("pre");
					pre.className = "details-pre";
					pre.textContent = toPrettyJson({
						tool_call_id: toolCall?.tool_call_id || null,
						parent_tool_call_id: toolCall?.parent_tool_call_id || null,
						arguments: toolCall?.arguments || {}
					});

					item.appendChild(title);
					item.appendChild(pre);
					toolsSection.appendChild(item);
				});
			}

			detailsContentEl.appendChild(intermediatesSection);
			detailsContentEl.appendChild(toolsSection);
			detailsBackdropEl.classList.add("open");
		}

		function hideDetails() {
			currentDetailsSource = null;
			detailsBackdropEl.classList.remove("open");
		}

		function refreshOpenDetails(details) {
			if (!detailsBackdropEl.classList.contains("open")) return;
			if (currentDetailsSource !== details) return;
			showDetails(details);
		}

		function renderBubbleContent(role, text) {
			return role === "assistant" ? renderMarkdownBasic(text) : escapeHtml(text);
		}

		function setBubbleText(bubble, role, text) {
			const contentEl = bubble.querySelector(".bubble-content");
			if (!contentEl) return;
			contentEl.innerHTML = renderBubbleContent(role, text);
		}

		function setBubbleMeta(bubble, meta = "") {
			let metaEl = bubble.querySelector(".meta");
			if (!meta) {
				if (metaEl) metaEl.remove();
				return;
			}

			if (!metaEl) {
				metaEl = document.createElement("div");
				metaEl.className = "meta";
				bubble.appendChild(metaEl);
			}
			metaEl.textContent = meta;
		}

		function setBubbleIntermediates(bubble, responses = []) {
			const intermediatesEl = bubble.querySelector(".bubble-intermediates");
			if (!intermediatesEl) return;

			const items = Array.isArray(responses)
				? responses.filter((item) => typeof item === "string" && item.length > 0)
				: [];

			if (items.length === 0) {
				intermediatesEl.classList.remove("open");
				intermediatesEl.innerHTML = "";
				return;
			}

			intermediatesEl.classList.add("open");
			intermediatesEl.innerHTML = "";

			const title = document.createElement("div");
			title.className = "bubble-intermediates-title";
			title.textContent = "Reasoning";
			intermediatesEl.appendChild(title);

			const text = document.createElement("div");
			text.className = "bubble-intermediates-text";
			text.textContent = items.join("");
			intermediatesEl.appendChild(text);
		}

		function attachBubbleDetails(bubble, details) {
			bubble.classList.remove("has-details");
			bubble.title = "";
			bubble.onclick = null;

			if (!hasDetails(details)) {
				return;
			}

			bubble.classList.add("has-details");
			bubble.title = "Click to view tool calls and intermediate responses";
			bubble.onclick = (event) => {
				if (event.target instanceof Element && event.target.closest("a")) {
					return;
				}
				showDetails(details);
			};
		}

		function renderBubble(role, text, meta = "", details = null) {
			const wrap = document.createElement("div");
			wrap.className = `bubble-wrap ${role}`;

			const bubble = document.createElement("div");
			bubble.className = `bubble ${role}`;

			const contentEl = document.createElement("div");
			contentEl.className = "bubble-content";
			contentEl.innerHTML = renderBubbleContent(role, text);
			bubble.appendChild(contentEl);

			const intermediatesEl = document.createElement("div");
			intermediatesEl.className = "bubble-intermediates";
			bubble.appendChild(intermediatesEl);

			setBubbleMeta(bubble, meta);
			if (role === "assistant") {
				attachBubbleDetails(bubble, details);
			}

			wrap.appendChild(bubble);
			chatEl.appendChild(wrap);
			scrollToBubbleTop(wrap);
			return { wrap, bubble, contentEl, intermediatesEl };
		}

		function invalidateHistoryReplay() {
			historyReplayGeneration += 1;
			historyReplayInFlight = false;
		}

		// Fetch and repaint a session's prior transcript from the server so a
		// resumed/restored session shows its history instead of an empty
		// window. Best-effort: older servers (no /history route), storage that
		// isn't configured, and network errors all leave the window as-is.
		async function loadSessionHistory(sessionId, options = {}) {
			const { announce = true, replaceView = false } = options;
			const requestedId = typeof sessionId === "string" ? sessionId.trim() : "";
			if (!requestedId || !isValidSessionId(requestedId) || !state.baseUrl) return;

			const generation = ++historyReplayGeneration;
			historyReplayInFlight = true;
			// Keep workflow cards from racing the transcript repaint. A current
			// replay restarts polling in finally; session switches separately
			// invalidate any poll already in flight.
			stopWorkflowPolling();
			try {
				// Optionally blank the transcript up-front so a resumed session
				// never shows the previous session's bubbles while the request
				// is in flight.
				if (replaceView) {
					chatEl.innerHTML = "";
					restoredGreetingContent = null;
					hideDetails();
				}

				const endpoint = `${state.baseUrl}${getApiBasePath()}/history${buildAuthQuery()}`;
				let payload;
				try {
					const resp = await fetch(endpoint, {
						method: "GET",
						headers: { "x-ms-session-id": requestedId, "Accept": "application/json" },
					});
					// A 404 means this server predates the history endpoint —
					// stay silent and leave whatever is already on screen.
					if (!resp.ok) return;
					payload = await resp.json();
				} catch (_e) {
					return;
				}

				// The active session or transcript may have changed while the
				// fetch was pending. Never replace newer user/streaming bubbles.
				if (
					state.sessionId !== requestedId
					|| generation !== historyReplayGeneration
				) return;

				const messages = Array.isArray(payload && payload.messages) ? payload.messages : [];
				const rendered = messages.filter(
					(m) => m && (m.role === "user" || m.role === "assistant")
						&& typeof m.text === "string" && m.text.length > 0
				);
				if (rendered.length === 0) return;

				chatEl.innerHTML = "";
				restoredGreetingContent = null;
				hideDetails();
				if (payload?.truncated === true) {
					renderBubble(
						"copilot",
						`Showing the ${rendered.length} most recent messages. Older messages are not displayed.`,
						"History"
					);
				}
				for (const message of rendered) {
					const isUser = message.role === "user";
					renderBubble(isUser ? "you" : "assistant", message.text, isUser ? "You" : "Assistant");
				}
				scrollChatToBottom();
				if (announce) {
					const count = rendered.length;
					const qualifier = payload?.truncated === true ? " most recent" : " previous";
					const suffix = payload?.truncated === true ? " Older messages were omitted." : "";
					setStatus(
						`Loaded ${count}${qualifier} message${count === 1 ? "" : "s"} for session ${shortSessionId(requestedId)}.${suffix}`
					);
				}
			} finally {
				if (generation === historyReplayGeneration) {
					historyReplayInFlight = false;
					startWorkflowPolling();
				}
			}
		}

		function renderWaitingBubble() {
			const wrap = document.createElement("div");
			wrap.className = "bubble-wrap assistant";
			wrap.id = "waitingBubble";

			const bubble = document.createElement("div");
			bubble.className = "bubble assistant";
			bubble.innerHTML = `
				<span class="typing" aria-label="Waiting for response">
					<span class="typing-dot"></span>
					<span class="typing-dot"></span>
					<span class="typing-dot"></span>
				</span>
			`;

			wrap.appendChild(bubble);
			chatEl.appendChild(wrap);
			scrollChatToBottom();
		}

		function clearWaitingBubble() {
			document.getElementById("waitingBubble")?.remove();
		}

		function setLoading(loading, options = {}) {
			const showWaitingBubble = options.showWaitingBubble !== false;
			state.loading = loading;
			updateComposerAvailability();

			if (loading) {
				if (showWaitingBubble) {
					renderWaitingBubble();
				}
				state.loadingSeconds = 0;
				setStatus("Waiting for agent...");
				state.loadingTimer = window.setInterval(() => {
					state.loadingSeconds += 1;
					setStatus(`Waiting for agent... ${state.loadingSeconds}s`);
				}, 1000);
			} else {
				clearWaitingBubble();
				if (state.loadingTimer) {
					clearInterval(state.loadingTimer);
					state.loadingTimer = null;
				}
			}
		}

		function appendAuthQuery(url) {
			if (!state.key) return url;
			const separator = url.includes("?") ? "&" : "?";
			return `${url}${separator}code=${encodeURIComponent(state.key)}`;
		}

		function resolveSettlementLocation(location) {
			if (typeof location !== "string" || !location.trim()) {
				throw new Error("Run status Location is invalid.");
			}

			const apiBasePath = getApiBasePath();
			const agentsPathIndex = apiBasePath.lastIndexOf("/agents/");
			const deploymentPrefix = agentsPathIndex > 0
				? apiBasePath.slice(0, agentsPathIndex)
				: "";
			const trimmedLocation = location.trim();
			const target = (
				trimmedLocation === "/agents" ||
				trimmedLocation.startsWith("/agents/")
			)
				? `${deploymentPrefix}${trimmedLocation}`
				: trimmedLocation;
			const resolved = new URL(
				target,
				`${state.baseUrl}${apiBasePath}/`
			);
			if (resolved.protocol !== "http:" && resolved.protocol !== "https:") {
				throw new Error("Run status Location must use HTTP or HTTPS.");
			}
			if (resolved.origin !== new URL(state.baseUrl).origin) {
				throw new Error("Run status Location must use the configured origin.");
			}
			return resolved.toString();
		}

		function runMetadataFromResponse(response, body = null) {
			const location = response.headers.get("Location") || body?.status_url || null;
			const sessionId = response.headers.get("x-ms-session-id") || body?.session_id || null;
			const runId = response.headers.get("x-ms-run-id") || body?.run_id || null;
			if (!location || !sessionId || !runId) return null;
			return { location, sessionId, runId };
		}

		function scheduleRunSettlement() {
			if (!state.settling || state.settlementTimer) return;
			state.settlementTimer = window.setTimeout(() => {
				state.settlementTimer = null;
				void pollRunSettlement();
			}, 2000);
		}

		async function pollRunSettlement() {
			if (
				!state.settling ||
				state.settlementPollInFlight ||
				!state.settlementLocation ||
				!state.settlementSessionId
			) {
				return;
			}

			const expectedBaseUrl = state.baseUrl;
			const expectedSessionId = state.settlementSessionId;
			const expectedRunId = state.settlementRunId;
			state.settlementPollInFlight = true;
			try {
				const statusUrl = resolveSettlementLocation(state.settlementLocation);
				const response = await fetch(appendAuthQuery(statusUrl), {
					method: "GET",
					headers: {
						"x-ms-session-id": expectedSessionId,
						"Accept": "application/json"
					}
				});
				if (
					expectedBaseUrl !== state.baseUrl ||
					expectedSessionId !== state.settlementSessionId ||
					expectedRunId !== state.settlementRunId
				) {
					return;
				}
				if (!response.ok) {
					throw new Error(`Run status returned HTTP ${response.status}.`);
				}

				const payload = await response.json();
				if (payload?.phase === "terminal") {
					clearRunSettlement();
					setStatus(
						state.sessionId
							? `Connected • Session ${state.sessionId}`
							: "Connected"
					);
					return;
				}

				setStatus("Response complete. Finishing session cleanup...");
				scheduleRunSettlement();
			} catch (error) {
				if (
					expectedBaseUrl === state.baseUrl &&
					expectedSessionId === state.settlementSessionId &&
					expectedRunId === state.settlementRunId
				) {
					setStatus(`Waiting for session cleanup. ${error.message}`, true);
					scheduleRunSettlement();
				}
			} finally {
				state.settlementPollInFlight = false;
			}
		}

		function beginRunSettlement(metadata) {
			clearRunSettlement();
			if (state.sessionId !== metadata.sessionId) {
				state.sessionId = metadata.sessionId;
				sessionWasFromServer = true;
				sessionIdIsExplicit = false;
				persistSessionId();
				updateSessionBar();
				recordSessionActivity(state.sessionId, lastSentUserMessage);
			}
			state.settling = true;
			state.settlementSessionId = metadata.sessionId;
			state.settlementRunId = metadata.runId;
			state.settlementLocation = metadata.location;
			updateComposerAvailability();
			setStatus("Response complete. Finishing session cleanup...");
			void pollRunSettlement();
		}
		function clearSessionIdError() {
			if (!sessionIdErrorEl) return;
			sessionIdErrorEl.textContent = "";
			sessionIdErrorEl.hidden = true;
			if (sessionIdInputEl) sessionIdInputEl.classList.remove("input-error");
		}

		function showSessionIdError(message) {
			if (!sessionIdErrorEl) return;
			sessionIdErrorEl.textContent = message;
			sessionIdErrorEl.hidden = false;
			if (sessionIdInputEl) sessionIdInputEl.classList.add("input-error");
		}

		function showSettings(force = false) {
			baseUrlInputEl.value = state.baseUrl || defaultBaseUrl;
			keyInputEl.value = state.key || "";
			settingsSessionIdPrefill = state.sessionId || "";
			if (sessionIdInputEl) sessionIdInputEl.value = settingsSessionIdPrefill;
			clearSessionIdError();
			renderRecentSessions();
			cancelSettingsBtnEl.style.display = force ? "none" : "inline-block";
			settingsBackdropEl.classList.add("open");
			baseUrlInputEl.focus();
		}

		function hideSettings() {
			settingsBackdropEl.classList.remove("open");
		}

		function loadSettings() {
			state.baseUrl = (localStorage.getItem(STORAGE_KEYS.baseUrl) || "").trim();
			state.key = (localStorage.getItem(STORAGE_KEYS.key) || "").trim();
			// IMPORTANT: do NOT restore state.sessionId here. We can't read
			// the right namespaced localStorage key until
			// loadSettingsFromHash() has had a chance to override baseUrl,
			// and an auto-assigned id must not ride along on chat requests
			// for an app whose workflow support hasn't been confirmed yet
			// (would break the "non-workflow apps unchanged" invariant).
			// loadRestoredSessionCandidate() runs later to load that
			// candidate — and to immediately re-activate a user-supplied
			// (explicit) id, which is durable for every app type.
		}

		function persistSessionId(force = false) {
			// Only persist auto-assigned ids once workflow support has been
			// confirmed for this base URL; otherwise we'd be silently
			// introducing session continuity for plain (non-workflow) chat
			// apps. Explicit resumes pass force=true to bypass that gate.
			if (!force && !workflowsAreSupported()) return;
			try {
				if (state.sessionId) {
					localStorage.setItem(storageKeyForSessionId(), state.sessionId);
					if (sessionIdIsExplicit) {
						localStorage.setItem(storageKeyForSessionIdSource(), "explicit");
					} else {
						localStorage.removeItem(storageKeyForSessionIdSource());
					}
				} else {
					localStorage.removeItem(storageKeyForSessionId());
					localStorage.removeItem(storageKeyForSessionIdSource());
				}
			} catch (_e) {
				// Storage quota or disabled — non-fatal.
			}
		}

		function loadSettingsFromHash() {
			const rawHash = window.location.hash ? window.location.hash.slice(1) : "";
			if (!rawHash) {
				return false;
			}

			const params = new URLSearchParams(rawHash);
			const hashBaseUrl = (params.get("baseUrl") || "").trim().replace(/\/+$/, "");
			const hashKey = (params.get("key") || "").trim();

			if (!hashBaseUrl && !hashKey) {
				return false;
			}

			if (hashBaseUrl) {
				state.baseUrl = hashBaseUrl;
				localStorage.setItem(STORAGE_KEYS.baseUrl, state.baseUrl);
			}

			if (hashKey) {
				state.key = hashKey;
				localStorage.setItem(STORAGE_KEYS.key, state.key);
			}

			history.replaceState(null, "", `${location.pathname}${location.search}`);
			return true;
		}

		function isLocalBaseUrl(baseUrl) {
			if (!baseUrl) return false;
			try {
				const parsed = new URL(baseUrl);
				const hostname = (parsed.hostname || "").toLowerCase();
				if (!hostname) return false;
				return (
					hostname === "localhost" ||
					hostname === "127.0.0.1" ||
					hostname === "::1" ||
					hostname.endsWith(".localhost")
				);
			} catch {
				return false;
			}
		}

		function requiresFunctionKey(baseUrl) {
			return !isLocalBaseUrl(baseUrl);
		}

		function saveSettings() {
			const previousBaseUrl = state.baseUrl;
			const nextBaseUrl = baseUrlInputEl.value.trim().replace(/\/+$/, "");
			const nextKey = keyInputEl.value.trim();

			if (!nextBaseUrl) {
				setStatus("Base URL is required.", true);
				baseUrlInputEl.focus();
				return false;
			}

			if (requiresFunctionKey(nextBaseUrl) && !nextKey) {
				setStatus("Key is required for non-localhost URLs.", true);
				keyInputEl.focus();
				return false;
			}

			// Validate the optional session id BEFORE mutating any state so
			// an invalid value blocks the whole save with an inline error.
			const sessionIdRaw = sessionIdInputEl ? sessionIdInputEl.value.trim() : "";
			if (sessionIdRaw && !isValidSessionId(sessionIdRaw)) {
				showSessionIdError(
					`Use 1–${SESSION_ID_MAX_LENGTH} characters: letters, digits, dot (.), underscore (_) or hyphen (-).`
				);
				if (sessionIdInputEl) sessionIdInputEl.focus();
				return false;
			}
